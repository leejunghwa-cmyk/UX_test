<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 데이터 관리 UX 비교 테스트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--bg:#ececec;--ink:#000;--muted:#a0a0a0;--line:#a3a3a3;--blue:#1010ff;--blue-d:#0000d9;font-family:Pretendard,'Noto Sans KR',Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.6;font-size:15px}
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:flex;flex-direction:column;background:var(--bg)}#app{flex:1}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:1px solid #dce1e9;border-radius:9px;background:#fff;padding:10px 18px;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #6b6bff;outline-offset:3px}
button:disabled{opacity:.45;cursor:default}

/* 공통 헤더·푸터 */
.top{height:60px;padding:0 34px;background:#000;color:#e8e8e8;display:flex;align-items:center;justify-content:space-between;gap:16px;font-size:16px;font-weight:600;flex-shrink:0}
.footer{padding:28px 20px 40px;text-align:center;font-size:13px;font-weight:600;color:#000}
body:has(.intro-wrap) .footer{display:none}

/* 공통 버튼 */
.btn{height:48px;min-width:160px;padding:12px 16px;font-size:14px;font-weight:600;border:1px solid var(--blue);border-radius:6px;background:#fff;color:var(--blue);letter-spacing:-.025em}
.btn:hover{background:#f3f3ff}.btn.primary{background:var(--blue);color:#fff}.btn.primary:hover{background:var(--blue-d)}
.btn.sm{height:40px;min-width:0;padding:7px 14px;font-size:14px}
.btns{display:flex;justify-content:center;gap:12px;margin-top:56px;flex-wrap:wrap}.btns.left{justify-content:flex-start;margin-top:32px}

/* 공통 카드 */
.page{width:100%;max-width:820px;margin:0 auto;padding:60px 20px 20px}
.page.center{min-height:calc(100svh - 150px);display:flex;align-items:center}
.page.wide{max-width:980px}
.panel{width:100%;background:#fff;border-radius:10px;padding:40px 48px}
.badge{display:inline-block;border:1px solid #000;border-radius:30px;padding:7px 14px;font-size:15px;font-weight:600;line-height:22px;letter-spacing:-.03em}
.meta{font-size:17px;letter-spacing:-.02em}.meta i{font-style:normal;margin:0 10px}
.ptitle{font-size:30px;line-height:1.35;font-weight:700;letter-spacing:-.04em;margin:18px 0 8px}
.psub{font-size:15px;color:#555;margin:0 0 8px;letter-spacing:-.02em}
.hint{font-size:14px;line-height:1.55;text-align:center;letter-spacing:-.02em}
.note{background:#f6f6f6;border:1px solid #ddd;border-radius:6px;padding:12px 16px;font-size:13px;color:#555}
.error{color:#c62828;font-size:14px}.error:empty{display:none}

/* 과제 안내 화면 (첨부 디자인) */
.brief{text-align:center;padding:40px 48px 44px}
.brief .badge{margin:52px 0 18px}
.brief-title{font-size:36px;font-weight:700;letter-spacing:-.045em;line-height:1.3;margin:0 0 12px}
.brief-inst{font-size:22px;font-weight:600;letter-spacing:-.04em;line-height:1.5;margin:0}
.brief-inst u{text-decoration-thickness:2px;text-underline-offset:5px}
.brief-desc{font-size:16px;margin:68px 0 14px;letter-spacing:-.03em}
.brief .hint{max-width:586px;margin:0 auto}

/* 평가 폼 */
.q{display:block;font-size:16px;font-weight:600;letter-spacing:-.03em;margin:28px 0 10px}
.q small{font-weight:400;color:var(--muted)}
.scale{display:flex;gap:8px}.scale label{flex:1;margin:0}.scale input{position:absolute;opacity:0}
.scale span{display:block;text-align:center;border:1px solid var(--line);padding:11px 0;border-radius:6px;cursor:pointer;font-weight:600}
.scale span:hover{border-color:var(--blue);color:var(--blue)}
.scale input:checked+span{background:var(--blue);color:#fff;border-color:var(--blue)}
.scale input:focus-visible+span{outline:3px solid #6b6bff;outline-offset:2px}
.under{font-size:12px;margin-top:6px;display:flex;justify-content:space-between;color:#777}
textarea,select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:6px;background:#fff}
textarea{min-height:100px;resize:vertical}

/* 결과 화면 */
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:16px}td,th{padding:12px 8px;text-align:left;border-bottom:1px solid #e5e5e5}th{font-weight:600}

/* 과제 수행 화면 */
.progress{height:4px;background:#d6d6d6}.progress i{display:block;height:100%;background:var(--blue)}
.taskbar{background:#fff;border-bottom:1px solid #ddd;padding:14px 28px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.taskbar p{margin:4px 0 0;font-size:16px;font-weight:600;letter-spacing:-.03em}
.tb-right{display:flex;align-items:center;gap:14px}.clock{color:#777;font-size:14px;min-width:60px;text-align:right}
.chip{display:inline-block;border:1px solid #000;border-radius:30px;padding:2px 10px;font-size:12px;font-weight:600}
.nav i{width:20px;margin-right:10px;text-align:center}

/* 재현 화면(기존 ChatGPT) · 제안 대시보드 — 원본 유지 */
.workspace{display:grid;grid-template-columns:260px 1fr;min-height:max(640px,calc(100svh - 213px));background:#fff;color:#171717;font-family:Arial,'Noto Sans KR',sans-serif}
.sidebar{border-right:1px solid #e5e5e5;padding:24px 14px;background:#fafafa;color:#222}.sidebar strong{display:block;padding:5px 15px;margin-bottom:24px}
.nav{display:block;border:0;background:transparent;width:100%;text-align:left;padding:11px 16px;border-radius:8px;margin:3px 0}.nav:hover{background:#f0f0f0}.nav.active{background:#ececec}
.content{padding:35px 6%;color:#171717;max-width:1200px}.content h2{font-size:29px;font-weight:500;margin:0 0 32px}.content h3{font-size:17px}.content p{color:#586779}.muted{color:#6b7788}
.settingsbox{border:1px solid #dedede;border-radius:18px;padding:0 20px}
.row{padding:20px 0;display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid #e2e2e2}.row:last-child{border-bottom:0}.row p{margin:2px 0;font-size:13px;max-width:680px;color:#777}
.pill{background:#f1f1f1;border:0;border-radius:30px;padding:8px 16px;white-space:nowrap}
.toggle{width:42px;height:25px;border-radius:30px;padding:3px;border:0;background:#ddd;flex-shrink:0}.toggle i{display:block;width:19px;height:19px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0001;transition:transform .15s}.toggle.on{background:#3983fb}.toggle.on i{transform:translateX(17px)}
.wprimary{background:#254fc2;color:#fff;border-color:#254fc2}.wprimary:hover{background:#193b99}
.wchip{display:inline-block;border:1px solid #d5e1f6;color:#4768a4;background:#f0f5ff;border-radius:30px;padding:3px 10px;font-size:12px}
.weyebrow{color:#4868b1;letter-spacing:.12em;font-size:12px;font-weight:bold}
.proposed{background:#f5f7fc}.proposed .sidebar{background:#182a46;color:#c7d3e7}.proposed .nav{color:#c7d3e7}.proposed .nav:hover{background:#25395a}.proposed .nav.active{background:#304565;color:#fff}
.proposed .content{max-width:none;color:#19283f}.proposed .content h2{font-weight:700;font-size:28px;margin-bottom:8px}.proposed .settingsbox{background:#fff;border-color:#e1e6ef}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:28px 0}.metric{background:#fff;border:1px solid #dde5f0;border-radius:14px;padding:20px;text-align:left}.metric b{display:block;font-size:26px;margin:9px 0}.metric span{font-size:12px;color:#6380a8}
.modalback{position:fixed;inset:0;background:#0005;display:flex;align-items:center;justify-content:center;padding:24px;z-index:5}
.modal{background:#fff;border-radius:20px;width:820px;max-width:100%;max-height:85vh;overflow:auto;padding:28px;color:#222;box-shadow:0 20px 80px #0002;font-family:Arial,'Noto Sans KR',sans-serif}
.modalhead{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eee;padding-bottom:14px}.modalhead h3{margin:0;font-size:23px}.modal p{color:#333}
.modal .actions{display:flex;gap:10px;margin-top:20px}

/* 시작 화면 */
.intro-wrap{width:calc(100% - 80px);max-width:1270px;min-height:calc(100svh - 60px);margin:0 auto;padding:0 29px 92px 0;display:flex;align-items:center}
.intro-hero{width:100%;display:grid;grid-template-columns:minmax(0,586px) minmax(0,531px);gap:clamp(40px,8.61vw,124px);align-items:stretch}
.intro-copy{display:flex;flex-direction:column;align-items:flex-start;padding-top:1px}
.intro-copy h1{font-size:44px;font-weight:700;line-height:1.28;letter-spacing:-.045em;margin:0 0 22px}
.intro-copy .intro-description{font-size:18px;line-height:1.5;margin:0;white-space:nowrap;letter-spacing:-.045em}
.intro-copy .steps{display:flex;flex-wrap:wrap;gap:8px;margin:56px 0 12px}
.intro-copy .steps span{font-size:16px;font-weight:600;line-height:22px;background:#fff;border:1px solid #000;border-radius:6px;padding:8px 14px;letter-spacing:-.04em}
.intro-copy .intro-summary{font-size:16px;line-height:1.5;margin:0;letter-spacing:-.03em}
.intro-copy .hint{margin-top:auto;width:100%;}
.intro-card{background:#fff;border-radius:10px;padding:27px 32px 29px;min-width:0}
.intro-card h2{font-size:30px;line-height:40px;letter-spacing:-.04em;margin:0 0 18px;font-weight:700}
.intro-card .code-label{display:block;font-size:16px;line-height:24px;margin:0 0 20px;font-weight:600}
.intro-card input[type=text]{width:100%;height:48px;border:1px solid var(--line);border-radius:6px;padding:12px 16px;font-size:16px}
.intro-card input::placeholder{color:#666;opacity:1}
.intro-card .code-hint{display:block;margin-top:8px;color:var(--muted);font-size:13px;line-height:20px}
.intro-card .consent-label{display:flex;align-items:flex-start;gap:9px;font-size:15px;font-weight:600;line-height:22px;letter-spacing:-.045em;margin:20px 0}
.intro-card input[type=checkbox]{appearance:none;flex:0 0 21px;width:21px;height:21px;margin:0;border:1px solid var(--line);border-radius:4px;background:#fff;cursor:pointer}
.intro-card input[type=checkbox]:checked{appearance:auto;accent-color:var(--blue)}
.intro-card .record-note{font-size:13px;line-height:18px;color:var(--muted);margin:0 0 21px;letter-spacing:-.025em}
.intro-card .btns{margin:0;justify-content:flex-start;gap:22px}
.intro-card .error{margin-top:12px}

@media(min-width:761px) and (max-width:1250px){.intro-hero{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:40px}.intro-copy .intro-description{white-space:normal}.intro-copy h1{font-size:38px}.intro-copy .steps{margin-top:36px}.intro-copy .steps span{font-size:14px;padding:8px}.intro-card .btns{gap:12px}.intro-card .btn{min-width:0}}
@media(max-width:760px){
.top{padding:0 20px;font-size:12px}
.intro-wrap{width:100%;padding:44px 20px}.intro-hero{grid-template-columns:1fr;gap:32px}.intro-copy h1{font-size:34px}.intro-copy .intro-description{white-space:normal;font-size:16px}.intro-copy .steps{margin-top:28px;gap:6px}.intro-copy .steps span{font-size:13px;padding:7px 10px}.intro-copy .intro-summary{font-size:15px}.intro-copy .hint{margin-top:28px}.intro-card{padding:26px 24px}.intro-card h2{font-size:27px}.intro-card .btns{gap:12px}.intro-card .btn{min-width:0;flex:1;font-size:14px}
.page{padding:28px 16px 12px}.panel,.brief{padding:28px 22px}.brief .badge{margin-top:32px}.brief-title{font-size:27px}.brief-inst{font-size:17px}.brief-desc{font-size:14px;margin-top:40px}.brief-desc br{display:none}.btns{margin-top:36px}.btn{flex:1;min-width:0;font-size:14px}.ptitle{font-size:24px}
.taskbar{flex-direction:column;align-items:flex-start;padding:14px}.workspace{grid-template-columns:150px 1fr}.content{padding:25px 16px}.cards{grid-template-columns:1fr}.scale{gap:4px}
}
</style></head>
<body><header class="top"><div>비교 테스트 · 검토용 초안 v0.3</div><div>UX 디자인 연구</div></header><div id="app"></div><div id="modal"></div><footer class="footer">가상 데이터로 진행하는 연구용 프로토타입입니다. 실제 ChatGPT 계정에는 영향을 주지 않습니다.</footer>
<script>
'use strict';
/* ───────── 연구 설정 ─────────
   ENDPOINT: Google Apps Script 웹 앱 URL을 붙여넣으면 응답이 구글 시트로 자동 전송됩니다.
   비워두면 이전처럼 브라우저에만 저장됩니다(검토용).                                  */
const ENDPOINT='https://script.google.com/macros/s/AKfycbw3nblvKCBPoEcSayneQBmmsyf_fk4XA1yrr04oPzcEHDo4HcgYfugbMrve8qq4Penk-g/exec';
const KEY='ai-data-ux-pilot-v1',VERSION='0.3.0';

/* 유형 배정: ① 링크의 ?type=A / ?type=B 가 우선
              ② 없으면 참여자 코드 숫자로 배정 (홀수 P01·P03… → A, 짝수 P02·P04… → B)
              ③ 코드에 숫자가 없으면 무작위                                            */
const assignedType=new URLSearchParams(location.search).get('type')?.toUpperCase();
const fixedType=['A','B'].includes(assignedType)?assignedType:null;
function assignType(code){if(fixedType)return fixedType;const n=parseInt(code.replace(/\D/g,''),10);if(!Number.isNaN(n))return n%2===1?'A':'B';return Math.random()<.5?'A':'B'}
const orders={A:['existing','proposal'],B:['proposal','existing']};

const app=document.querySelector('#app'),modal=document.querySelector('#modal');
let session=null,stage='intro',idx=0,page='general',memoryOpen=false,learning=true,clicks=0,startAt=0,startISO='',timer=null,completed=false,away=0,hiddenAt=null,lastRecord=null;
const tasks=[
 {id:'memory',title:'생성형 AI서비스가 나에 대해 기억하고 있는 내용을 확인해주세요.',lead:'생성형 AI 서비스가 <u>나에 대해 기억하고 있는 내용</u>을 확인해주세요.',instruction:'생성형 AI 서비스가 나에 대해 기억하고 있는 내용을 확인해주세요.'},
 {id:'learning',title:'내 대화가 AI 모델 학습에 쓰이지 않게 하기',lead:'앞으로 하는 대화가 <u>AI 학습에 쓰이지 않도록</u> 설정을 바꿔보세요.',instruction:'앞으로 입력하는 채팅이 모델 학습에 사용되지 않도록 설정해주세요.'}
];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function saved(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch{return null}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(session));return true}catch{document.querySelector('#storage-error')?.replaceChildren(document.createTextNode('브라우저 저장에 실패했습니다. 결과 파일을 내려받아 보관해 주세요.'));return false}}
function send(kind,payload){if(!ENDPOINT||!session)return;try{fetch(ENDPOINT,{method:'POST',mode:'no-cors',keepalive:true,headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({kind,sessionId:session.id,code:session.code,studyType:session.studyType,order:session.order.join('>'),version:VERSION,sentAt:new Date().toISOString(),payload})}).catch(()=>{})}catch{}}
function condition(){return session.order[Math.floor(idx/2)]}function task(){return tasks[idx%2]}

function intro(){window.scrollTo(0,0);stage='intro';const old=saved();
const storeNote=ENDPOINT?'응답은 연구용 데이터 시트로 전송됩니다. 참여자 코드 외의 개인 식별 정보는 수집하지 않습니다.':'현재는 동작 검토용 초안입니다. 응답은 이 브라우저에만 저장되며 연구자에게 자동 전송되지 않습니다.<br>본 조사 전 문항·동의문·저장 방식을 확정합니다.';
app.innerHTML=`<main class="intro-wrap"><div class="intro-hero"><section class="intro-copy"><h1>내 데이터 관리,<br>어떻게 설정하시나요?</h1><p class="intro-description">두 가지 데이터 설정 화면을 사용해 보고, 정보를 찾고 설정하는 경험을 평가합니다.</p><div class="steps"><span>01 안내·동의</span><span>02 화면별 과제</span><span>03 사용 후 평가</span></div><p class="intro-summary">과업 4회 / 화면별 평가 2회 / PC사용 권장</p><div class="hint">${storeNote}</div></section><section class="intro-card"><h2>테스트 시작</h2><label class="code-label" for="code">참여자 코드</label><input id="code" type="text" maxlength="30" placeholder="예 : P01" autocomplete="off" aria-describedby="code-hint"><small id="code-hint" class="code-hint">안내받은 코드를 입력해 주세요.</small><label class="consent-label"><input id="consent" type="checkbox"><span>안내 내용을 확인했으며 자발적으로 참여합니다.</span></label><p class="record-note">기록 항목: 참여자 코드, 화면 제시 순서, 과제 시간, 클릭 수, 완료 여부, 탭 이탈 시간, 평가 응답. 언제든 중단할 수 있습니다. 녹화는 하지 않습니다.</p><div class="btns"><button class="btn primary" id="begin">동의하고 시작하기 &gt;</button><button class="btn" id="resume">이전 기록 보기</button></div><div id="error" class="error" role="alert"></div></section></div></main>`;
document.querySelector('#begin').onclick=()=>{const code=document.querySelector('#code').value.trim();if(!code||!document.querySelector('#consent').checked){document.querySelector('#error').textContent='참여자 코드와 참여 동의를 확인해 주세요.';return}if(old&&!confirm('이 브라우저의 이전 기록을 새 세션으로 대체합니다. 계속할까요?'))return;const studyType=assignType(code);session={version:VERSION,id:typeof crypto.randomUUID==='function'?crypto.randomUUID():'session-'+Date.now()+'-'+Array.from(crypto.getRandomValues(new Uint32Array(2))).join('-'),code,studyType,order:[...orders[studyType]],createdAt:new Date().toISOString(),userAgent:navigator.userAgent,screen:innerWidth+'x'+innerHeight,records:[],surveys:[],active:null,status:'in_progress',storage:ENDPOINT?'remote_sheet+browser':'browser_local_only'};idx=0;persist();send('start',{createdAt:session.createdAt,userAgent:session.userAgent,screen:session.screen});brief()};
document.querySelector('#resume').onclick=()=>{if(!old){document.querySelector('#error').textContent='이 브라우저에 저장된 이전 기록이 없습니다.';return}session=old;results()}}

function brief(){window.scrollTo(0,0);stage='brief';page=condition()==='existing'?'general':'overview';learning=true;memoryOpen=false;completed=false;const t=task();
app.innerHTML=`<main class="page center"><section class="panel brief"><div class="meta">${esc(session.studyType)}유형<i>|</i>TASK ${idx+1}/4<i>|</i>화면 ${Math.floor(idx/2)+1}</div><span class="badge">${idx%2+1}번째 과제</span><h1 class="brief-title">${t.title}</h1><p class="brief-inst">${t.lead}</p><p class="brief-desc">'시작하기'를 누르면 화면이 열리고 시간을 재기 시작해요.<br>찾으면 자동으로 끝나요. 잘 모르겠으면 '과제 중단'을 눌러도 괜찮아요.</p><div class="hint">화면 속 모든 내용은 테스트용 가상 데이터입니다. 과제마다 설정과 시작 위치가 초기화됩니다.</div><div class="btns"><button class="btn primary" id="start">시작하기 &gt;</button><button class="btn" id="exit">기록 저장 후 나가기</button></div></section></main>`;
document.querySelector('#start').onclick=startTask;document.querySelector('#exit').onclick=results}

function startTask(){stage='task';clicks=0;away=0;hiddenAt=null;startAt=performance.now();startISO=new Date().toISOString();session.active={index:idx,startedAt:startISO};persist();renderTask();clearInterval(timer);timer=setInterval(()=>{const el=document.querySelector('#clock');if(el&&!completed)el.textContent=((performance.now()-startAt)/1000).toFixed(1)+'초'},100)}
function row(title,description,control){return `<div class="row"><div>${title}${description?`<p>${description}</p>`:''}</div>${control||''}</div>`}
function toggle(){return `<button data-action="learning" class="toggle ${learning?'on':''}" role="switch" aria-checked="${learning}" aria-label="모델 개선을 위한 데이터 학습 허용"><i></i></button>`}
function existingContent(){if(page==='general')return '<h2>일반</h2><div class="settingsbox">'+row('언어','앱 UI 언어','<button class="pill" data-action="noop">자동 감지⌄</button>')+row('사용 가능한 추론 수준','모델 컨트롤에 표시할 추론 수준을 선택하세요. 사용 가능 여부는 모델마다 다릅니다.','<button class="pill" data-action="noop">6개 선택됨⌄</button>')+'</div>';if(page==='personalization')return `<h2>개인 맞춤 설정</h2><h3>ChatGPT 메모리</h3><p class="muted">ChatGPT의 메모리 관리 방식을 설정합니다.</p><div class="settingsbox">${row('메모리 활성화','ChatGPT가 채팅, 파일, 연결된 앱을 바탕으로 사용자 경험을 맞춤 설정합니다.','<button class="toggle on" data-action="noop" role="switch" aria-checked="true" aria-label="메모리 활성화"><i></i></button>')}${row('메모리 요약','ChatGPT가 회원님에 대해 알게 된 내용을 한눈에 확인하세요. 항상 기억해 두었으면 하는 정보는 사용자 지정 지침에 입력하세요. 기존에 저장된 메모리도 계속 관리할 수 있습니다.','<button class="pill" data-action="memory">관리</button>')}</div><h3 style="margin-top:45px">글쓰기</h3><div class="settingsbox">${row('내 문체 참고','ChatGPT가 채팅, 라이브러리 파일, 연결된 앱을 참고해 사용자의 문체로 글을 쓰도록 허용하세요.','<button class="toggle" data-action="noop" role="switch" aria-checked="false" aria-label="내 문체 참고"><i></i></button>')}</div><h3 style="margin-top:45px">참고 사진</h3><div class="settingsbox">${row('참고 사진','내 모습을 담은 이미지를 만들 때 ChatGPT가 참고하는 사진입니다.','<button class="pill" data-action="noop">추가 ›</button>')}</div>`;if(page==='data')return `<h2>데이터 관리</h2><div class="settingsbox">${row('공유 링크','','<button class="pill" data-action="noop">관리</button>')}${row('모델 개선을 위한 데이터 학습 허용','채팅이 모델 학습에 사용될지 설정하세요.',toggle())}${row('위치','이 설정을 켜면 ChatGPT가 사용자의 위치를 활용하여 지역 맞춤 추천, 뉴스, 날씨 등 관련성 높은 정보를 제공합니다.','<button class="pill" data-action="noop">켜기</button>')}${row('Work 네트워크 액세스','','<button class="toggle on" data-action="noop" role="switch" aria-checked="true" aria-label="Work 네트워크 액세스"><i></i></button>')}${row('ChatGPT Work 재설정','','<button class="pill" data-action="noop" style="color:#dc5252">재설정</button>')}${row('앱과 공유되는 정보','','<button class="pill" data-action="noop">›</button>')}${row('보관된 채팅','','<button class="pill" data-action="noop">›</button>')}${row('모든 채팅 보관하기','','<button class="pill" data-action="noop">모두 보관하기</button>')}${row('모든 채팅 삭제','','<button class="pill" data-action="noop" style="color:#dc5252">전체 삭제</button>')}${row('데이터 내보내기','','<button class="pill" data-action="noop">내보내기</button>')}${row('쿠키 설정','','<button class="pill" data-action="noop">관리</button>')}</div>`;if(page==='storage')return '<h2>저장 공간</h2><b>20 GB 중 1.94 GB 사용</b><div style="background:#ddd;height:9px;border-radius:10px;margin:20px 0 45px"><div style="width:10%;background:#111;height:100%;border-radius:10px"></div></div><h3>저장 공간 관리</h3><p>저장 공간을 관리해 여유 공간을 확보하세요.</p><div class="settingsbox">'+row('파일','1.27 GB · 파일 332개','<button class="pill" data-action="noop">›</button>')+row('이미지','684 MB · 이미지 1,537개','<button class="pill" data-action="noop">›</button>')+'</div>';return `<h2>${esc(page)}</h2><p>이 초안에서는 메모리 확인과 모델 학습 설정 경로를 검토할 수 있습니다.</p>`}
function proposedContent(){if(page==='memory')return `<h2>저장메모리</h2><p>개인화에 참고되는 나에 관한 정보를 확인합니다.</p><div class="settingsbox">${row('메모리 요약','기억된 내용의 요약이며 전체 목록은 아닙니다.','<button class="wprimary" data-action="memory">요약 보기</button>')}</div>`;if(page==='purposes')return `<h2>활용 목적과 설정</h2><p>개인화와 모델 개선 설정을 구분해 확인합니다.</p><div class="settingsbox">${row('개인화','메모리를 참고해 나에게 맞는 답변을 제공합니다.','<span class="wchip">켜짐</span>')}${row('모델 개선','새로 입력하는 채팅의 모델 학습 사용 여부를 설정합니다.',toggle())}</div><p class="muted">모델 학습 설정과 메모리 활용 설정은 별도의 항목입니다.</p>`;if(page==='chats')return '<h2>대화기록</h2><p>저장된 대화 12개 · 이 초안에서는 목록을 구현하지 않았습니다.</p>';if(page==='files')return '<h2>업로드 자료</h2><p>파일과 이미지 3개 · 이 초안에서는 목록을 구현하지 않았습니다.</p>';return `<span class="weyebrow">MY DATA OVERVIEW</span><h2>내 데이터 관리</h2><p>저장된 정보와 활용 설정을 한곳에서 확인하세요.</p><div class="cards"><button class="metric" data-action="nav" data-page="chats">대화기록<b>12<span> 개</span></b><span>저장된 대화 확인 →</span></button><button class="metric" data-action="nav" data-page="memory">저장메모리<b>요약</b><span>나에 대해 기억하는 내용 →</span></button><button class="metric" data-action="nav" data-page="files">업로드 자료<b>3<span> 개</span></b><span>파일과 이미지 확인 →</span></button></div><h3>데이터 활용 설정</h3><div class="settingsbox">${row('개인화','저장메모리를 참고한 맞춤 답변','<button class="pill" data-action="nav" data-page="memory">메모리 확인</button>')}${row('모델 개선','새로 입력하는 채팅의 모델 학습 사용 여부',toggle())}</div><p class="muted" style="font-size:13px">요약은 기억된 정보의 전체 목록이 아닙니다.</p>`}
function renderTask(){const proposed=condition()==='proposal';
app.innerHTML=`<div class="progress"><i style="width:${idx/4*100}%"></i></div><div class="taskbar"><div><span class="chip">화면 ${Math.floor(idx/2)+1} · 과제 ${idx%2+1}/2</span><p>${task().instruction}</p></div><div class="tb-right"><span id="clock" class="clock">측정 중</span><button id="stop" class="btn sm">과제 중단</button></div></div><div id="workspace" class="workspace ${proposed?'proposed':''}"><aside class="sidebar"><strong>${proposed?'DATA CONTROL':'설정'}</strong>${(proposed?[['overview','<i class="fa-solid fa-table-cells-large"></i>대시보드'],['memory','<i class="fa-solid fa-brain"></i>저장메모리'],['purposes','<i class="fa-solid fa-sliders"></i>활용 목적·설정'],['files','<i class="fa-solid fa-folder-open"></i>업로드 자료'],['chats','<i class="fa-solid fa-comments"></i>대화기록']]:[['general','⚙ 일반'],['모양','☼ 모양'],['알림','♧ 알림'],['보안 및 로그인','♙ 보안 및 로그인'],['계정','◎ 계정'],['보관된 채팅','▣ 보관된 채팅'],['storage','▱ 저장 공간'],['personalization','◉ 개인 맞춤 설정'],['사용량','◴ 사용량'],['data','♧ 데이터 관리']]).map(([id,name])=>`<button class="nav ${page===id?'active':''}" data-action="nav" data-page="${id}">${name}</button>`).join('')}</aside><section class="content">${proposed?proposedContent():existingContent()}</section></div>`;
document.querySelector('#stop').onclick=()=>{if(confirm('이 과제를 중단하고 다음 단계로 진행할까요?'))finishTask('abandoned')};
document.querySelector('#workspace').onclick=e=>{if(completed)return;clicks++;const b=e.target.closest('button');if(!b)return;const a=b.dataset.action;if(a==='nav'){page=b.dataset.page;renderTask()}if(a==='memory'){showMemory();if(task().id==='memory')finishTask('success',true)}if(a==='learning'){learning=!learning;renderTask();if(task().id==='learning'&&!learning)finishTask('success')}if(a==='noop')b.title='이 초안에서는 해당 기능을 구현하지 않았습니다.'}}
const fakeMemory=`<h3>개요</h3><p>사용자는 직장인이며 주말 여행과 요리를 즐깁니다. 간결하고 단계별로 정리된 답변을 선호합니다.</p><h3>취미와 선호</h3><p>산책과 사진 촬영을 좋아하며, 여행을 계획할 때 대중교통으로 이동할 수 있는 장소를 선호합니다.</p><h3>일과 생활</h3><p>업무 자료를 표로 정리하는 것을 선호하고, 최근에는 발표 자료를 준비하고 있습니다.</p>`;
function showMemory(){memoryOpen=true;modal.innerHTML=`<div class="modalback"><section class="modal" role="dialog" aria-modal="true" aria-label="메모리 요약"><div class="modalhead"><h3>메모리 요약 <small style="font-size:13px">방금 업데이트됨</small></h3><div><button id="info" aria-label="메모리 정보">⋯</button><button id="close" aria-label="닫기">×</button></div></div>${fakeMemory}<div id="infoarea"></div><div id="memorynext"></div></section></div>`;document.querySelector('#info').onclick=()=>{if(!completed)clicks++;document.querySelector('#infoarea').innerHTML='<div class="note">ChatGPT는 사용자에 관한 중요한 정보를 자동으로 기억하고 최신 상태로 유지합니다. 이 요약 페이지는 기억된 내용을 간략히 보여주며, 전체 목록은 아닙니다.</div>'};document.querySelector('#close').onclick=()=>{modal.innerHTML='';if(completed)afterTask()}}
function finishTask(outcome,keepOpen=false){if(completed)return;completed=true;clearInterval(timer);const end=performance.now();if(hiddenAt!==null){away+=end-hiddenAt;hiddenAt=null}lastRecord={index:idx,condition:condition(),task:task().id,startedAt:startISO,endedAt:new Date().toISOString(),elapsedMs:Math.round(end-startAt),clicks,hiddenMs:Math.round(away),outcome};session.records.push(lastRecord);session.active=null;persist();if(keepOpen){document.querySelector('#memorynext').innerHTML='<div class="actions"><button id="memnext" class="btn primary">확인 후 다음으로 &gt;</button></div>';document.querySelector('#memnext').onclick=()=>{modal.innerHTML='';afterTask()};document.querySelector('#clock').textContent='측정 종료';document.querySelector('#stop').disabled=true}else afterTask()}
function afterTask(){window.scrollTo(0,0);stage='taskdone';
app.innerHTML=`<main class="page"><section class="panel"><span class="badge">${lastRecord.outcome==='success'?'과제 완료':'과제 중단'}</span><h2 class="ptitle">수행 경험을 알려주세요</h2><p class="psub">TASK ${idx+1}/4 · ${task().title}</p><form id="taskform"><p class="q">이 과제를 수행하는 것은 얼마나 쉬웠나요?</p>${scale('ease',7,'매우 어려움','매우 쉬움')}<label class="q" for="comment">어렵거나 혼란스러운 부분이 있었다면 적어주세요. <small>(선택)</small></label><textarea id="comment" maxlength="2000"></textarea><div class="btns left"><button class="btn primary">다음으로 &gt;</button></div></form></section></main>`;
document.querySelector('#taskform').onsubmit=e=>{e.preventDefault();lastRecord.ease=Number(new FormData(e.target).get('ease'));lastRecord.comment=document.querySelector('#comment').value;persist();send('task',lastRecord);if(idx%2===1)survey();else{idx++;brief()}}}
function scale(name,n,left,right){return `<div class="scale">${Array.from({length:n},(_,i)=>`<label><input required type="radio" name="${name}" value="${i+1}"><span>${i+1}</span></label>`).join('')}</div><div class="under"><span>${left}</span><span>${right}</span></div>`}
function survey(){window.scrollTo(0,0);stage='survey';
app.innerHTML=`<main class="page"><section class="panel"><div class="meta">화면 ${Math.floor(idx/2)+1}<i>|</i>사용 후 평가</div><h2 class="ptitle">방금 사용한 화면에 대해 답해주세요</h2><p class="psub">아래 문항은 동작 확인용 초안입니다. 본 조사에서는 확정된 평가 문항으로 교체합니다.</p><form id="survey">${['내 정보가 어디에 저장되어 있는지 파악하기 쉬웠다.','개인화와 모델 학습 설정의 차이를 이해할 수 있었다.','원하는 방식으로 데이터 활용 설정을 조절할 수 있다고 느꼈다.'].map((q,i)=>`<p class="q">${i+1}. ${q}</p>${scale('q'+i,5,'전혀 그렇지 않다','매우 그렇다')}`).join('')}<label class="q" for="understanding">4. 메모리 요약은 기억된 정보 전체를 보여주나요?</label><select id="understanding" name="understanding" required><option value="">선택해 주세요</option><option value="all">전체를 보여준다</option><option value="summary">일부를 요약해서 보여준다</option><option value="unknown">잘 모르겠다</option></select><div class="btns left"><button class="btn primary">${idx===3?'테스트 완료':'두 번째 화면으로 &gt;'}</button></div></form></section></main>`;
document.querySelector('#survey').onsubmit=e=>{e.preventDefault();const entry={condition:condition(),answers:Object.fromEntries(new FormData(e.target))};session.surveys.push(entry);send('survey',entry);if(idx===3){session.status='completed';session.completedAt=new Date().toISOString();persist();send('complete',session);results()}else{idx++;persist();brief()}}}
function results(){window.scrollTo(0,0);clearInterval(timer);stage='results';modal.innerHTML='';const interrupted=!!session.active;const done=session.status==='completed';
const storeMsg=ENDPOINT?'<b>응답이 연구 데이터 시트로 전송되었습니다.</b><br>참여해 주셔서 감사합니다. 만약을 위해 아래에서 백업 파일을 내려받을 수도 있습니다.':'<b>브라우저에만 저장됨 · 서버 전송 없음</b><br>이 기록은 현재 기기·브라우저에만 있습니다. 브라우저 데이터를 삭제하면 사라질 수 있으니 결과 파일을 내려받아 보관해 주세요.';
app.innerHTML=`<main class="page wide"><section class="panel"><div class="meta">SESSION RECORD</div><h2 class="ptitle">${done?'테스트를 모두 마쳤습니다.':'현재 기록을 확인하세요.'}</h2><div class="hint" style="margin:14px 0 6px">${storeMsg}</div>${interrupted?'<p class="error">화면 새로고침 또는 종료로 중단된 과제가 있습니다. 해당 과제는 완료 시간으로 계산하지 않았습니다.</p>':''}<p class="q" style="margin-top:30px">참여자 ${esc(session.code)} · ${session.studyType?esc(session.studyType)+'유형':'이전 버전 기록'} · ${session.order.map(v=>v==='existing'?'기존 화면':'제안 대시보드').join(' → ')}</p><div style="overflow:auto"><table><thead><tr><th>조건</th><th>과제</th><th>경과 시간</th><th>클릭</th><th>탭 이탈</th><th>결과</th></tr></thead><tbody>${session.records.map(r=>`<tr><td>${r.condition==='existing'?'기존':'제안'}</td><td>${r.task==='memory'?'메모리 확인':'모델 학습 끄기'}</td><td>${(r.elapsedMs/1000).toFixed(2)}초</td><td>${r.clicks}</td><td>${(r.hiddenMs/1000).toFixed(2)}초</td><td>${r.outcome==='success'?'완료':'중단'}</td></tr>`).join('')}</tbody></table></div><p class="psub" style="margin-top:14px;font-size:13px">A유형은 기존 → 제안, B유형은 제안 → 기존 순서입니다. 두 유형의 과제와 설문은 동일합니다.</p><div class="btns left"><button class="btn primary" id="csv">과제 결과 CSV</button><button class="btn" id="json">전체 응답 JSON</button><button class="btn" id="home">처음으로</button></div><p id="storage-error" class="error" role="alert"></p></section></main>`;
document.querySelector('#csv').onclick=()=>download('csv');document.querySelector('#json').onclick=()=>download('json');document.querySelector('#home').onclick=intro}
function download(type){let text;if(type==='json')text=JSON.stringify(session,null,2);else{const cols=['session_id','participant_code','study_type','version','condition','task','started_at','elapsed_ms','clicks','hidden_ms','outcome','ease','comment'];const cells=x=>'"'+String(x??'').replace(/"/g,'""').replace(/^[=+@-]/,"'$&")+'"';text='\uFEFF'+[cols,...session.records.map(r=>[session.id,session.code,session.studyType,session.version,r.condition,r.task,r.startedAt,r.elapsedMs,r.clicks,r.hiddenMs,r.outcome,r.ease,r.comment])].map(row=>row.map(cells).join(',')).join('\r\n')}const url=URL.createObjectURL(new Blob([text],{type:type==='json'?'application/json;charset=utf-8':'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='ux-study-'+session.code.replace(/[^a-z0-9_-]/gi,'_')+'.'+type;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.addEventListener('visibilitychange',()=>{if(stage!=='task'||completed)return;if(document.hidden)hiddenAt=performance.now();else if(hiddenAt!==null){away+=performance.now()-hiddenAt;hiddenAt=null}});
intro();
</script></body></html>
