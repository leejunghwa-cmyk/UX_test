<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 데이터 관리 UX 비교 테스트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--bg:#ececec;--ink:#000;--muted:#a0a0a0;--line:#a3a3a3;--blue:#1010ff;--blue-d:#0000d9;font-family:Pretendard,'Noto Sans KR',Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.6;font-size:15px}
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:flex;flex-direction:column;background:var(--bg)}#app{flex:1}

button:disabled{opacity:.45;cursor:default}

/* 공통 헤더·푸터 */

.footer{padding:28px 20px 40px;text-align:center;font-size:13px;font-weight:600;color:#000}

/* 공통 버튼 */

.btn:hover{background:#f3f3ff}.btn.primary{background:var(--blue);color:#fff}.btn.primary:hover{background:var(--blue-d)}
.btn.sm{height:40px;min-width:0;padding:7px 14px;font-size:14px}
.btns{display:flex;justify-content:center;gap:12px;margin-top:56px;flex-wrap:wrap}.btns.left{justify-content:flex-start;margin-top:32px}

/* 공통 카드 */
.page{width:100%;max-width:820px;margin:0 auto;padding:60px 20px 20px}
.page.center{min-height:calc(100svh - 150px);display:flex;align-items:center}
.page.wide{max-width:980px}
.panel{width:100%;background:#fff;border-radius:10px;padding:40px 48px}

.meta{font-size:17px;letter-spacing:-.02em}.meta i{font-style:normal;margin:0 10px}
.ptitle{font-size:30px;line-height:1.35;font-weight:700;letter-spacing:-.04em;margin:18px 0 8px}

.brief-title{font-size:36px;font-weight:700;letter-spacing:-.045em;line-height:1.3;margin:0 0 12px}

.brief-desc{font-size:16px;margin:68px 0 14px;letter-spacing:-.03em}
.brief .hint{max-width:586px;margin:0 auto}

/* 평가 폼 */
.q{display:block;font-size:16px;font-weight:600;letter-spacing:-.03em;margin:28px 0 10px}

.under{font-size:12px;margin-top:6px;display:flex;justify-content:space-between;color:#777}
textarea,select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:6px;background:#fff}
textarea{min-height:100px;resize:vertical}

/* 결과 화면 */
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:16px}td,th{padding:12px 8px;text-align:left;border-bottom:1px solid #e5e5e5}th{font-weight:600}

/* 과제 수행 화면 */
.progress{height:4px;background:#d6d6d6}.progress i{display:block;height:100%;background:var(--blue)}
.taskbar{position:relative;background:#eef0ff;border-bottom:2px solid var(--blue);padding:18px 220px;text-align:center}
.tb-task{max-width:900px;margin:0 auto}

.sq{display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:10px;background:#000;color:#fff;font-size:26px;font-weight:800;line-height:1}
.screen-pill{display:inline-flex;align-items:center;gap:12px;font-size:18px;font-weight:700;margin-bottom:22px}.screen-pill .sq{width:54px;height:54px;font-size:30px}
.taskbar p{word-break:keep-all;margin:8px 0 0;font-size:20px;font-weight:700;line-height:1.45;letter-spacing:-.035em;color:#000}
.taskbar .chip{background:var(--blue);border-color:var(--blue);color:#fff;font-size:13px;padding:3px 12px}
.tb-right{position:absolute;right:28px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:14px}.tb-right .btn{white-space:nowrap}.clock{color:#777;font-size:14px;min-width:60px;text-align:right}
.chip{display:inline-block;border:1px solid #000;border-radius:30px;padding:2px 10px;font-size:12px;font-weight:600}
.nav i{width:20px;margin-right:10px;text-align:center}
.link{border:0;background:none;padding:0;color:#2563eb;cursor:pointer;font:inherit;text-decoration:underline;text-underline-offset:2px}

/* 재현 화면(기존 ChatGPT) · 제안 대시보드 — 원본 유지 */
.workspace{display:grid;grid-template-columns:260px 1fr;min-height:max(640px,calc(100svh - 213px));background:#fff;color:#171717;font-family:Arial,'Noto Sans KR',sans-serif}
.sidebar{border-right:1px solid #e5e5e5;padding:24px 14px;background:#fafafa;color:#222}.sidebar strong{display:block;padding:5px 15px;margin-bottom:24px}
.nav{display:block;border:0;background:transparent;width:100%;text-align:left;padding:11px 16px;border-radius:8px;margin:3px 0}.nav:hover{background:#f0f0f0}.nav.active{background:#ececec}
.content{padding:35px 6%;color:#171717;max-width:1200px}.content h2{font-size:29px;font-weight:500;margin:0 0 32px}.content h3{font-size:17px}.content p{color:#586779}.muted{color:#6b7788}
.settingsbox{border:1px solid #dedede;border-radius:18px;padding:0 20px}
.row{padding:20px 0;display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid #e2e2e2}.row:last-child{border-bottom:0}.row p{margin:2px 0;font-size:13px;max-width:680px;color:#777}
.pill{background:#f1f1f1;border:0;border-radius:30px;padding:8px 16px;white-space:nowrap}
.toggle{width:42px;height:25px;border-radius:30px;padding:3px;border:0;background:#ddd;flex-shrink:0}.toggle i{display:block;width:19px;height:19px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0001;transition:transform .15s}.toggle.on{background:#3983fb}.toggle.on i{transform:translateX(17px)}
.wprimary{background:#254fc2;color:#fff;border-color:#254fc2}.wprimary:hover{background:#193b99}
.wchip{display:inline-block;border:1px solid #d5e1f6;color:#4768a4;background:#f0f5ff;border-radius:30px;padding:3px 10px;font-size:12px}
.weyebrow{color:#4868b1;letter-spacing:.12em;font-size:12px;font-weight:bold}
.proposed{background:#f5f7fc}.proposed .sidebar{background:#182a46;color:#c7d3e7}.proposed .nav{color:#c7d3e7}.proposed .nav:hover{background:#25395a}.proposed .nav.active{background:#304565;color:#fff}
.proposed .content{max-width:none;color:#19283f}.proposed .content h2{font-weight:700;font-size:28px;margin-bottom:8px}.proposed .settingsbox{background:#fff;border-color:#e1e6ef}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:28px 0}.metric{background:#fff;border:1px solid #dde5f0;border-radius:14px;padding:20px;text-align:left}.metric b{display:block;font-size:26px;margin:9px 0}.metric span{font-size:12px;color:#6380a8}
.modalback{position:fixed;inset:0;background:#0005;display:flex;align-items:center;justify-content:center;padding:24px;z-index:5}
.modal{background:#fff;border-radius:20px;width:820px;max-width:100%;max-height:85vh;overflow:auto;padding:28px;color:#222;box-shadow:0 20px 80px #0002;font-family:Arial,'Noto Sans KR',sans-serif}
.modalhead{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eee;padding-bottom:14px}.modalhead h3{margin:0;font-size:23px}.modal p{color:#333}
.modal .actions{display:flex;gap:10px;margin-top:20px}
[hidden]{display:none!important}
.choice{display:grid;gap:8px}.choice label{margin:0}.choice input{position:absolute;opacity:0}.choice span{display:block;border:1px solid var(--line);padding:12px 16px;border-radius:6px;cursor:pointer;font-weight:600}.choice span:hover{border-color:var(--blue);color:var(--blue)}.choice input:checked+span{background:var(--blue);color:#fff;border-color:var(--blue)}.choice input:focus-visible+span{outline:3px solid #6b6bff;outline-offset:2px}
/* 삭제 완료 레이어 팝업 */
.layer{position:fixed;inset:0;background:#0004;display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.layerbox{background:#fff;border-radius:16px;padding:30px 32px 26px;width:380px;max-width:100%;text-align:center;box-shadow:0 20px 60px #0003;font-family:Arial,'Noto Sans KR',sans-serif;color:#222}
.layerbox h3{margin:14px 0 6px;font-size:19px}.layerbox p{margin:0;color:#555;font-size:14px;line-height:1.5}.layerbox .btn{width:100%;margin-top:22px}

/* 시작 화면 */
.intro-wrap{width:calc(100% - 80px);max-width:1270px;min-height:calc(100svh - 60px);margin:0 auto;padding:0 29px 92px 0;display:flex;align-items:center}
.intro-hero{width:100%;display:grid;grid-template-columns:minmax(0,586px) minmax(0,531px);gap:clamp(40px,8.61vw,124px);align-items:stretch}
.intro-copy{display:flex;flex-direction:column;align-items:flex-start;padding-top:1px}
.intro-copy h1{font-size:44px;font-weight:700;line-height:1.28;letter-spacing:-.045em;margin:0 0 22px}
.intro-copy .intro-description{font-size:18px;line-height:1.5;margin:0;white-space:nowrap;letter-spacing:-.045em}
.intro-copy .steps{display:flex;flex-wrap:wrap;gap:8px;margin:56px 0 12px}
.intro-copy .steps span{font-size:16px;font-weight:600;line-height:22px;background:#fff;border:1px solid #000;border-radius:6px;padding:8px 14px;letter-spacing:-.04em}
.intro-copy .intro-summary{font-size:16px;line-height:1.5;margin:0;letter-spacing:-.03em}
.intro-copy .hint{margin-top:auto;width:100%;}
.intro-card{background:#fff;border-radius:10px;padding:27px 32px 29px;min-width:0}
.intro-card h2{font-size:30px;line-height:40px;letter-spacing:-.04em;margin:0 0 18px;font-weight:700}
.intro-card .code-label{display:block;font-size:16px;line-height:24px;margin:0 0 20px;font-weight:600}
.intro-card input[type=text]{width:100%;height:48px;border:1px solid var(--line);border-radius:6px;padding:12px 16px;font-size:16px}
.intro-card input::placeholder{color:#666;opacity:1}
.intro-card .code-hint{display:block;margin-top:8px;color:var(--muted);font-size:13px;line-height:20px}
.intro-card .consent-label{display:flex;align-items:flex-start;gap:9px;font-size:15px;font-weight:600;line-height:22px;letter-spacing:-.045em;margin:20px 0}
.intro-card input[type=checkbox]{appearance:none;flex:0 0 21px;width:21px;height:21px;margin:0;border:1px solid var(--line);border-radius:4px;background:#fff;cursor:pointer}
.intro-card input[type=checkbox]:checked{appearance:auto;accent-color:var(--blue)}
.intro-card .record-note{font-size:13px;line-height:18px;color:var(--muted);margin:0 0 21px;letter-spacing:-.025em}
.intro-card .btns{margin:0;justify-content:flex-start;gap:22px}
.intro-card .error{margin-top:12px}

@media(min-width:761px) and (max-width:1250px){.intro-hero{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:40px}.intro-copy .intro-description{white-space:normal}.intro-copy h1{font-size:38px}.intro-copy .steps{margin-top:36px}.intro-copy .steps span{font-size:14px;padding:8px}.intro-card .btns{gap:12px}.intro-card .btn{min-width:0}}
@media(max-width:760px){
.top{padding:0 20px;font-size:12px}
.intro-wrap{width:100%;padding:44px 20px}.intro-hero{grid-template-columns:1fr;gap:32px}.intro-copy h1{font-size:34px}.intro-copy .intro-description{white-space:normal;font-size:16px}.intro-copy .steps{margin-top:28px;gap:6px}.intro-copy .steps span{font-size:13px;padding:7px 10px}.intro-copy .intro-summary{font-size:15px}.intro-copy .hint{margin-top:28px}.intro-card{padding:26px 24px}.intro-card h2{font-size:27px}.intro-card .btns{gap:12px}.intro-card .btn{min-width:0;flex:1;font-size:14px}
.page{padding:28px 16px 12px}.panel,.brief{padding:28px 22px}.brief .badge{margin-top:32px}.brief-title{font-size:27px}.brief-inst{font-size:17px}.brief-desc{font-size:14px;margin-top:40px}.brief-desc br{display:none}.btns{margin-top:36px}.btn{flex:1;min-width:0;font-size:14px}.ptitle{font-size:24px}
.taskbar{padding:14px}.tb-screen{position:static;transform:none;justify-content:center;margin-bottom:8px}.tb-right{position:static;transform:none;justify-content:center;margin-top:10px}.tb-right .btn{flex:0 0 auto}.taskbar p{font-size:17px}.workspace{grid-template-columns:150px 1fr}.content{padding:25px 16px}.cards{grid-template-columns:1fr}.scale{gap:4px}
}
</style></head>
<body><header class="top"><div>비교 테스트 · v0.5</div><div>UX 디자인 연구</div></header><div id="app"></div><div id="modal"></div><footer class="footer">가상 데이터로 진행하는 연구용 프로토타입입니다. 실제 ChatGPT 계정에는 영향을 주지 않습니다.</footer>
<script>
'use strict';
/* ───────── 연구 설정 ─────────
   ENDPOINT: Google Apps Script 웹 앱 URL을 붙여넣으면 응답이 구글 시트로 자동 전송됩니다.
   비워두면 이전처럼 브라우저에만 저장됩니다(검토용).                                  */
const ENDPOINT='https://script.google.com/macros/s/AKfycbw3nblvKCBPoEcSayneQBmmsyf_fk4XA1yrr04oPzcEHDo4HcgYfugbMrve8qq4Penk-g/exec';
const KEY='ai-data-ux-pilot-v1',VERSION='0.5.0';

/* 유형 배정: ① 링크의 ?type=A / ?type=B 가 우선
              ② 없으면 참여자 코드 숫자로 배정 (홀수 P01·P03… → A, 짝수 P02·P04… → B)
              ③ 코드에 숫자가 없으면 무작위                                            */
const assignedType=new URLSearchParams(location.search).get('type')?.toUpperCase();
const fixedType=['A','B'].includes(assignedType)?assignedType:null;
/* 연구자 보기: 주소 끝에 ?admin=1 을 붙이면 결과 화면에 백업 다운로드 버튼이 보입니다 */
const ADMIN=new URLSearchParams(location.search).has('admin');
function assignType(code){if(fixedType)return fixedType;const n=parseInt(code.replace(/\D/g,''),10);if(!Number.isNaN(n))return n%2===1?'A':'B';return Math.random()<.5?'A':'B'}
const orders={A:['existing','proposal'],B:['proposal','existing']};

const app=document.querySelector('#app'),modal=document.querySelector('#modal');
let session=null,stage='intro',idx=0,page='general',memoryOpen=false,learning=true,clicks=0,errors=0,startAt=0,startISO='',timer=null,completed=false,away=0,hiddenAt=null,lastRecord=null;
const tasks=[
 {id:'memory',title:'기억된 내용 확인하기',lead:'생성형 AI 서비스는 대화하면서 알게 된 내 정보를 기억해 두고 답변에 활용합니다.<br>이 서비스가 <u>나에 대해 어떤 내용을 기억하고 있는지</u> 찾아서 확인해 주세요.',instruction:'이 서비스가 나에 대해 어떤 내용을 기억하고 있는지 찾아서 확인해 주세요.'},
 {id:'learning',title:'모델 학습에 쓰이지 않게 설정하기',lead:'내가 입력한 대화는 AI 모델을 더 좋게 만드는 학습에 쓰일 수 있습니다.<br>앞으로 입력하는 대화가 <u>모델 학습에 사용되지 않도록</u> 설정을 바꿔 주세요.',instruction:'앞으로 입력하는 대화가 모델 학습에 사용되지 않도록 설정을 바꿔 주세요.'},
 {id:'files',title:'업로드한 파일 찾기',lead:'대화 중에 올린 파일은 서비스 안에 그대로 남아 있습니다.<br>그중 <u>‘서비스개선_기획안.pdf’</u> 파일을 찾아서 열어 주세요.',instruction:'업로드한 파일 중 ‘서비스개선_기획안.pdf’ 파일을 찾아서 열어 주세요.'},
 {id:'forget',title:'특정 기억 지우기',lead:'발표 준비가 끝나서, AI가 이 내용을 더 이상 기억하지 않았으면 합니다.<br>기억된 내용 중 <u>‘발표 자료를 준비하고 있다’</u>는 항목만 골라서 지워 주세요.',instruction:'기억된 내용 중 ‘발표 자료를 준비하고 있다’는 항목만 골라서 지워 주세요.'}
];
/* 화면당 과업 수(PER)와 전체 과업 수(TOTAL)는 tasks 개수로 자동 계산됩니다 */
const PER=tasks.length,TOTAL=PER*2;
const TASK_LABEL={memory:'메모리 확인',learning:'모델 학습 끄기',files:'파일 찾기',forget:'특정 기억 삭제'};
/* 두 화면에 똑같이 보이는 가상 데이터 */
const FILES=[['서비스개선_기획안.pdf','2.4 MB · 10월 27일 업로드'],['회의메모_1029.docx','0.3 MB · 10월 29일 업로드'],['사용자조사_정리.xlsx','4.1 MB · 11월 1일 업로드']];
const MEM_BASE=[{id:'m1',text:'IT 기업에서 서비스 기획 업무를 담당하고 있다.'},{id:'m2',text:'발표 자료를 준비하고 있다.'},{id:'m3',text:'답변을 항목별로 정리해 주는 것을 선호한다.'},{id:'m4',text:'흰색 배경에 파란색·짙은 회색을 쓰는 차분한 디자인을 좋아한다.'},{id:'m5',text:'주말에는 산책과 간단한 요리를 즐긴다.'},{id:'m6',text:'데이터 시각화와 사용자 경험에 관심이 있다.'}];
const MEM_TARGET='m2',FILE_TARGET=0;let memItems=[];
function fileRows(){return FILES.map(([n,d],i)=>row(n,d,`<button class="pill" data-file="${i}">열기</button>`)).join('')}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function saved(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch{return null}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(session));return true}catch{document.querySelector('#storage-error')?.replaceChildren(document.createTextNode('브라우저 저장에 실패했습니다. 결과 파일을 내려받아 보관해 주세요.'));return false}}
/* 전송 대기함(outbox): 서버가 {ok:true}로 답한 기록만 지웁니다. 실패하면 브라우저에 남겨 두고 다시 보냅니다. */
let flushing=null;
function snapshot(){const {outbox,...rest}=session;return JSON.parse(JSON.stringify(rest))}
function newId(){return typeof crypto.randomUUID==='function'?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2)}
function send(kind,payload){if(!ENDPOINT||!session)return;(session.outbox=session.outbox||[]).push({eventId:newId(),kind,sessionId:session.id,code:session.code,studyType:session.studyType,order:session.order.join('>'),version:VERSION,sentAt:new Date().toISOString(),payload:JSON.parse(JSON.stringify(payload))});persist();flush()}
function flush(){if(!ENDPOINT||!session)return Promise.resolve(true);if(flushing)return flushing;const box=session.outbox=session.outbox||[];flushing=(async()=>{while(box.length){try{const r=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(box[0])});const j=await r.json();if(!j||!j.ok)break;box.shift();persist()}catch{break}}flushing=null;return box.length===0})();return flushing}
window.addEventListener('online',()=>flush());setInterval(()=>{if(session&&session.outbox&&session.outbox.length)flush()},15000);
/* 참여자에게 보이는 화면 이름: 처음 사용하는 화면 = A, 두 번째 화면 = B (실제 조건은 기록에만 저장) */
function scr(i=idx){return Math.floor(i/PER)===0?'A':'B'}

const fakeMemory=`<h3>개요</h3><p>사용자는 IT 기업에서 서비스 기획 업무를 담당하는 직장인입니다. 업무 자료 정리, 발표 준비, 일상적인 정보 탐색과 여행 계획을 위해 생성형 AI를 활용합니다. 복잡한 내용을 쉽게 풀어 설명하고, 필요한 정보를 항목별로 정리한 답변을 선호합니다. 최근에는 업무와 개인 일정을 함께 관리하는 방법에 관심이 있으며, 주말에는 산책이나 요리를 하며 여유롭게 시간을 보내려고 합니다.</p><h3>일과 업무</h3><p>사용자는 여러 부서의 의견을 모아 서비스 개선 방향을 정리하고, 회의 자료와 기획 문서를 작성하는 일을 합니다. 새로운 기능을 기획할 때는 사용자의 불편과 요구를 먼저 정리하고, 비슷한 서비스의 사례를 비교하는 방식을 선호합니다. 자료를 검토할 때는 핵심 내용, 판단 근거, 추가로 확인할 사항이 구분되어 있으면 이해하기 쉽다고 느낍니다.
발표 자료는 한 화면에 내용을 많이 넣기보다 핵심 메시지를 중심으로 간결하게 구성하려고 합니다. 디자인은 흰색 배경에 파란색이나 짙은 회색을 사용하는 차분한 스타일을 좋아합니다. 생성형 AI에는 회의 메모 요약, 문장 다듬기, 비교표 작성 등을 요청하며, 제안받은 내용은 직접 검토한 뒤 업무에 반영합니다.</p><h3>학습과 관심사</h3><p>사용자는 업무에 필요한 새로운 도구와 서비스 사용법을 꾸준히 배우고 싶어 합니다. 긴 설명을 한꺼번에 읽기보다는 전체 흐름을 먼저 확인하고, 필요한 부분을 단계별로 익히는 편입니다. 처음 접하는 개념은 일상적인 사례를 함께 들어주면 이해하기 쉽다고 느낍니다.
최근에는 데이터 시각화와 사용자 경험에 관심이 있습니다. 같은 정보라도 화면에 어떻게 배치하고 표현하느냐에 따라 이해하기 쉬운 정도가 달라진다고 생각합니다. 학습한 내용은 간단한 메모로 남기고, 실제 업무에 적용할 수 있는 예시를 따로 정리합니다.</p><h3>취미와 여가</h3><p>사용자는 산책과 사진 촬영을 즐깁니다. 사람이 지나치게 붐비는 장소보다 공원이나 강변처럼 천천히 걸을 수 있는 곳을 선호합니다. 사진은 전문 장비보다 휴대전화로 일상의 풍경을 기록하는 용도로 주로 촬영합니다. 날씨가 좋으면 카페에 들르거나 서점을 구경하며 시간을 보내기도 합니다.

집에서는 간단한 요리를 하거나 영화를 봅니다. 요리는 재료와 조리 과정이 복잡하지 않고, 한두 번 먹을 분량으로 만들 수 있는 메뉴를 선호합니다. 영화를 고를 때는 장르뿐 아니라 줄거리와 상영 시간을 함께 확인합니다. 결말을 미리 알게 되는 설명은 원하지 않습니다.</p>`;
/* ‘발표 자료 준비’ 기억을 지우면 요약에서도 관련 문장이 빠집니다 */
function memSummary(){let h=fakeMemory;if(!memItems.some(m=>m.id===MEM_TARGET))h=h.replace('업무 자료 정리, 발표 준비, ','업무 자료 정리, ').replace(/발표 자료는 한 화면에[^.]*\.\s*/,'');return h}
function showMemory(){memoryOpen=true;modal.innerHTML=`<div class="modalback"><section class="modal" role="dialog" aria-modal="true" aria-label="메모리 요약"><div class="modalhead"><h3>메모리 요약 <small style="font-size:13px">방금 업데이트됨</small></h3><div><button id="info" aria-label="메모리 정보">⋯</button><button id="close" aria-label="닫기">×</button></div></div>${memSummary()}<div id="infoarea"></div><div id="memorynext"></div></section></div>`;document.querySelector('#info').onclick=()=>{if(!completed)clicks++;document.querySelector('#infoarea').innerHTML='<div class="note">ChatGPT는 사용자에 관한 중요한 정보를 자동으로 기억하고 최신 상태로 유지합니다. 이 요약 페이지는 기억된 내용을 간략히 보여주며, 전체 목록은 아닙니다.</div>'};document.querySelector('#close').onclick=()=>{modal.innerHTML='';if(completed)afterTask()}}
function showMemList(){memoryOpen=true;modal.innerHTML=`<div class="modalback"><section class="modal" role="dialog" aria-modal="true" aria-label="저장된 메모리"><div class="modalhead"><h3>저장된 메모리</h3><div><button id="close" aria-label="닫기">×</button></div></div><p style="font-size:14px;color:#666">AI가 대화에서 기억해 둔 항목입니다. 필요 없는 항목은 삭제할 수 있습니다.</p><div class="settingsbox" id="memlist">${memItems.length?memItems.map(m=>row(esc(m.text),'',`<button class="pill" data-del="${m.id}" style="color:#dc5252">삭제</button>`)).join(''):'<div class="row">저장된 메모리가 없습니다.</div>'}</div><div id="memorynext"></div></section></div>`;document.querySelector('#memlist').onclick=e=>{const d=e.target.closest('[data-del]');if(!d||completed)return;clicks++;const item=memItems.find(m=>m.id===d.dataset.del);memItems=memItems.filter(m=>m.id!==d.dataset.del);const done=task().id==='forget'&&d.dataset.del===MEM_TARGET;if(task().id==='forget'&&!done)errors++;showMemList();if(done){finishTask('success',true);document.querySelector('#memorynext').innerHTML=''}showDeleted(item?item.text:'',done)};document.querySelector('#close').onclick=()=>{modal.innerHTML='';if(completed)afterTask()}}
function showLayer({icon='fa-circle-check',color='#16a34a',title,body='',btn='확인',onOk=null}){const l=document.createElement('div');l.className='layer';l.innerHTML=`<div class="layerbox" role="alertdialog" aria-modal="true" aria-labelledby="ltitle"><i class="fa-solid ${icon}" style="font-size:36px;color:${color}"></i><h3 id="ltitle">${title}</h3><p>${body}</p><button class="btn primary">${btn}</button></div>`;document.body.appendChild(l);const k=l.querySelector('button');k.focus();k.onclick=()=>{l.remove();if(onOk)onOk()}}
function showDeleted(text,done){showLayer({title:'선택한 기억이 삭제되었습니다.',body:`‘${esc(text)}’`,btn:done?'확인 후 다음으로 &gt;':'확인',onOk:done?()=>{modal.innerHTML='';afterTask()}:null})}
function openFile(i){const [n,d]=FILES[i];const hit=task().id==='files'&&i===FILE_TARGET;if(task().id==='files'&&!hit)errors++;if(hit)finishTask('success',true);showLayer({icon:'fa-file-lines',color:'#254fc2',title:esc(n),body:esc(d),btn:hit?'확인 후 다음으로 &gt;':'닫기',onOk:hit?afterTask:null})}
function finishTask(outcome,keepOpen=false){if(completed)return;completed=true;clearInterval(timer);const end=performance.now();if(hiddenAt!==null){away+=end-hiddenAt;hiddenAt=null}lastRecord={index:idx,condition:condition(),task:task().id,startedAt:startISO,endedAt:new Date().toISOString(),elapsedMs:Math.round(end-startAt),clicks,errors,hiddenMs:Math.round(away),outcome};session.records.push(lastRecord);session.active=null;persist();if(keepOpen){const nx=document.querySelector('#memorynext');if(nx){nx.innerHTML='<div class="actions"><button id="memnext" class="btn primary">확인 후 다음으로 &gt;</button></div>';document.querySelector('#memnext').onclick=()=>{modal.innerHTML='';afterTask()}}document.querySelector('#clock').textContent='측정 종료';document.querySelector('#stop').disabled=true}else afterTask()}
function afterTask(){window.scrollTo(0,0);stage='taskdone';
app.innerHTML=`<main class="page"><section class="panel"><span class="badge">${lastRecord.outcome==='success'?'과제 완료':'과제 중단'}</span><h2 class="ptitle">수행 경험을 알려주세요</h2><p class="psub">화면 ${scr()} · TASK ${idx+1}/${TOTAL} · ${task().title}</p><form id="taskform"><p class="q">이 과제를 수행하는 것은 얼마나 쉬웠나요?</p>${scale('ease',7,'매우 어려움','매우 쉬움')}<label class="q" for="comment">어렵거나 혼란스러운 부분이 있었다면 적어주세요. <small>(선택)</small></label><textarea id="comment" maxlength="2000"></textarea><div class="btns left"><button class="btn primary">다음으로 &gt;</button></div></form></section></main>`;
document.querySelector('#taskform').onsubmit=e=>{e.preventDefault();lastRecord.ease=Number(new FormData(e.target).get('ease'));lastRecord.comment=document.querySelector('#comment').value;persist();send('task',lastRecord);if(idx%PER===PER-1)survey();else{idx++;brief()}}}
function scale(name,n,left,right){return `<div class="scale">${Array.from({length:n},(_,i)=>`<label><input required type="radio" name="${name}" value="${i+1}"><span>${i+1}</span></label>`).join('')}</div><div class="under"><span>${left}</span><span>${right}</span></div>`}
function survey(){window.scrollTo(0,0);stage='survey';
app.innerHTML=`<main class="page"><section class="panel"><div class="screen-pill"><span class="sq">${scr()}</span>화면 ${scr()}</div><div class="meta">화면 ${scr()}<i>|</i>사용 후 평가</div><h2 class="ptitle">방금 사용한 화면 ${scr()}에 대해 답해주세요</h2><p class="psub">방금 사용한 화면에서의 경험을 기준으로 응답해 주세요.</p><form id="survey">${['내 정보가 어디에 저장되어 있는지 파악하기 쉬웠다.','개인화와 모델 학습 설정의 차이를 이해할 수 있었다.','원하는 방식으로 데이터 활용 설정을 조절할 수 있다고 느꼈다.','내가 변경한 설정이 적용되었는지 확인하기 쉬웠다.','원하지 않는 기억을 선택해서 삭제할 수 있다고 느꼈다.'].map((q,i)=>`<p class="q">${i+1}. ${q}</p>${scale('q'+i,5,'전혀 그렇지 않다','매우 그렇다')}`).join('')}<div class="btns left"><button class="btn primary">${idx===TOTAL-1?'다음으로 &gt;':'화면 B로 넘어가기 &gt;'}</button></div></form></section></main>`;
document.querySelector('#survey').onsubmit=e=>{e.preventDefault();const entry={condition:condition(),answers:Object.fromEntries(new FormData(e.target))};session.surveys.push(entry);send('survey',entry);if(idx===TOTAL-1){persist();finalQ()}else{idx++;persist();brief()}}}
function finalQ(){window.scrollTo(0,0);stage='final';
app.innerHTML=`<main class="page"><section class="panel"><div class="meta">마지막 질문</div><h2 class="ptitle">두 화면을 비교해 주세요</h2><p class="psub">두 화면을 모두 사용한 경험을 기준으로 응답해 주세요.</p><form id="finalform"><p class="q">1. 화면 A와 화면 B 중 어느 화면이 더 편리했나요?</p><div class="choice">${[['A','화면 A (처음 사용한 화면)'],['B','화면 B (두 번째로 사용한 화면)'],['same','비슷했다']].map(([v,l])=>`<label><input required type="radio" name="preferred" value="${v}"><span>${l}</span></label>`).join('')}</div><label class="q" for="reason">2. 그렇게 느낀 이유는 무엇인가요?</label><textarea id="reason" name="reason" maxlength="2000" required></textarea><div class="btns left"><button class="btn primary">테스트 완료</button></div></form></section></main>`;
document.querySelector('#finalform').onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));session.final={preferred:f.preferred,preferredCondition:f.preferred==='A'?session.order[0]:f.preferred==='B'?session.order[1]:'same',reason:f.reason};send('final',session.final);session.status='completed';session.completedAt=new Date().toISOString();persist();send('complete',snapshot());results()}}
function results(){window.scrollTo(0,0);clearInterval(timer);stage='results';modal.innerHTML='';const interrupted=!!session.active;const done=session.status==='completed';
app.innerHTML=`<main class="page wide"><section class="panel"><div class="meta">SESSION RECORD</div><h2 class="ptitle">${done?'테스트를 모두 마쳤습니다.':'현재 기록을 확인하세요.'}</h2><div class="hint" id="savestate" style="margin:14px 0 6px"></div>${interrupted?'<p class="error">화면 새로고침 또는 종료로 중단된 과제가 있습니다. 해당 과제는 완료 시간으로 계산하지 않았습니다.</p>':''}<p class="q" style="margin-top:30px">참여자 ${esc(session.code)}${ADMIN?` · ${session.studyType?esc(session.studyType)+'유형':'이전 버전 기록'} · ${session.order.map((v,i)=>'화면 '+'AB'[i]+'='+(v==='existing'?'기존':'제안')).join(', ')}`:''}</p><div style="overflow:auto"><table><thead><tr><th>화면</th><th>과제</th><th>경과 시간</th><th>클릭</th><th>탭 이탈</th><th>결과</th></tr></thead><tbody>${session.records.map(r=>`<tr><td>화면 ${scr(r.index)}${ADMIN?(r.condition==='existing'?' (기존)':' (제안)'):''}</td><td>${TASK_LABEL[r.task]||esc(r.task)}</td><td>${(r.elapsedMs/1000).toFixed(2)}초</td><td>${r.clicks}</td><td>${(r.hiddenMs/1000).toFixed(2)}초</td><td>${r.outcome==='success'?'완료':'중단'}</td></tr>`).join('')}</tbody></table></div>${ADMIN?'<p class="psub" style="margin-top:14px;font-size:13px">A유형은 기존 → 제안, B유형은 제안 → 기존 순서입니다. 두 유형의 과제와 설문은 동일합니다.</p>':''}<div class="btns left"><button class="btn primary" id="retry" hidden>다시 시도</button><button class="btn" id="csv" hidden>과제 결과 CSV</button><button class="btn" id="json" hidden>전체 응답 JSON</button><button class="btn" id="home">처음으로</button></div><p id="storage-error" class="error" role="alert"></p></section></main>`;
document.querySelector('#csv').onclick=()=>download('csv');document.querySelector('#json').onclick=()=>download('json');document.querySelector('#retry').onclick=updateSave;document.querySelector('#home').onclick=intro;updateSave()}
async function updateSave(){const el=document.querySelector('#savestate');if(!el)return;const show=(backup,retry)=>{document.querySelector('#csv').hidden=document.querySelector('#json').hidden=!backup;document.querySelector('#retry').hidden=!retry};
if(!ENDPOINT){el.innerHTML='<b>브라우저에만 저장됨 · 서버 전송 없음</b><br>이 기록은 현재 기기·브라우저에만 있습니다. 결과 파일을 내려받아 보관해 주세요.';show(true,false);return}
el.innerHTML='<b>응답을 저장하고 있습니다…</b><br>잠시만 기다려 주세요.';show(ADMIN,false);const ok=await flush();if(stage!=='results')return;
if(ok){el.innerHTML='<b>응답이 저장되었습니다.</b><br>참여해 주셔서 감사합니다.';show(ADMIN,false)}else{el.innerHTML='<b>응답 저장이 아직 완료되지 않았습니다.</b><br>인터넷 연결을 확인한 뒤 ‘다시 시도’를 눌러 주세요. 계속 실패하면 아래 백업 파일을 내려받아 연구자에게 보내 주세요.';show(true,true)}}
function download(type){let text;if(type==='json')text=JSON.stringify(snapshot(),null,2);else{const cols=['session_id','participant_code','study_type','version','condition','task','started_at','elapsed_ms','clicks','hidden_ms','outcome','errors','ease','comment'];const cells=x=>'"'+String(x??'').replace(/"/g,'""').replace(/^[=+@-]/,"'$&")+'"';text='\uFEFF'+[cols,...session.records.map(r=>[session.id,session.code,session.studyType,session.version,r.condition,r.task,r.startedAt,r.elapsedMs,r.clicks,r.hiddenMs,r.outcome,r.errors,r.ease,r.comment])].map(row=>row.map(cells).join(',')).join('\r\n')}const url=URL.createObjectURL(new Blob([text],{type:type==='json'?'application/json;charset=utf-8':'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='ux-study-'+session.code.replace(/[^a-z0-9_-]/gi,'_')+'.'+type;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.addEventListener('visibilitychange',()=>{if(stage!=='task'||completed)return;if(document.hidden)hiddenAt=performance.now();else if(hiddenAt!==null){away+=performance.now()-hiddenAt;hiddenAt=null}});
{const o=saved();if(ENDPOINT&&o&&o.outbox&&o.outbox.length){session=o;flush()}}
intro();
</script></body></html>
