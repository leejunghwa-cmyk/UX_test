<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 데이터 관리 UX 비교 테스트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--bg:#ececec;--ink:#000;--muted:#a0a0a0;--line:#a3a3a3;--blue:#1010ff;--blue-d:#0000d9;font-family:Pretendard,'Noto Sans KR',Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.6;font-size:15px}
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:flex;flex-direction:column;background:var(--bg)}#app{flex:1}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:1px solid #dce1e9;border-radius:9px;background:#fff;padding:10px 18px;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #6b6bff;outline-offset:3px}
button:disabled{opacity:.45;cursor:default}

/* 공통 헤더·푸터 */
.top{height:60px;padding:0 34px;background:#000;color:#e8e8e8;display:flex;align-items:center;justify-content:space-between;gap:16px;font-size:16px;font-weight:600;flex-shrink:0}
.footer{padding:28px 20px 40px;text-align:center;font-size:13px;font-weight:600;color:#000}
body:has(.intro-wrap) .footer{display:none}

/* 공통 버튼 */
.btn{height:48px;min-width:160px;padding:12px 16px;font-size:14px;font-weight:600;border:1px solid var(--blue);border-radius:6px;background:#fff;color:var(--blue);letter-spacing:-.025em}
.btn:hover{background:#f3f3ff}.btn.primary{background:var(--blue);color:#fff}.btn.primary:hover{background:var(--blue-d)}
.btn .fa-arrow-right{margin-left:6px;font-size:.9em}
.btn.sm{height:40px;min-width:0;padding:7px 14px;font-size:14px}
.btns{display:flex;justify-content:center;gap:12px;margin-top:56px;flex-wrap:wrap}.btns.left{justify-content:flex-start;margin-top:32px}

/* 공통 카드 */
.page{width:100%;max-width:820px;margin:0 auto;padding:60px 20px 20px}
.page.center{min-height:calc(100svh - 150px);display:flex;align-items:center}
.page.wide{max-width:980px}
.panel{width:100%;background:#fff;border-radius:10px;padding:40px 48px}
.badge{display:inline-block;border:1px solid #000;border-radius:30px;padding:7px 14px;font-size:15px;font-weight:600;line-height:22px;letter-spacing:-.03em}
.meta{font-size:17px;letter-spacing:-.02em}.meta i{font-style:normal;margin:0 10px}
.ptitle{font-size:30px;line-height:1.35;font-weight:700;letter-spacing:-.04em;margin:18px 0 8px}
.psub{font-size:15px;color:#555;margin:0 0 8px;letter-spacing:-.02em}
.hint{font-size:14px;line-height:1.55;text-align:center;letter-spacing:-.02em}
.note{background:#f6f6f6;border:1px solid #ddd;border-radius:6px;padding:12px 16px;font-size:13px;color:#555}
.error{color:#c62828;font-size:14px}.error:empty{display:none}

/* 과제 안내 화면 (첨부 디자인) */
.brief{text-align:center;padding:40px 48px 44px}
.brief .badge{margin:8px 0 24px}
.brief-title{font-size:36px;font-weight:700;letter-spacing:-.045em;line-height:1.3;margin:0 0 12px}
.brief-inst{font-size:19px;font-weight:500;letter-spacing:-.035em;line-height:1.75;margin:0;color:#222}
.brief-inst u{font-weight:700;color:#000}
.brief-inst u{text-decoration-thickness:2px;text-underline-offset:5px}
.brief-desc{font-size:16px;margin:50px 0 14px;letter-spacing:-.03em}
.brief .hint{max-width:586px;margin:0 auto}

/* 평가 폼 */
.q{display:block;font-size:16px;font-weight:600;letter-spacing:-.03em;margin:28px 0 10px}
.q small{font-weight:400;color:var(--muted)}
.scale{display:flex;gap:8px}.scale label{flex:1;margin:0}.scale input{position:absolute;opacity:0}
.scale span{display:block;text-align:center;border:1px solid var(--line);padding:11px 0;border-radius:6px;cursor:pointer;font-weight:600}
.scale span:hover{border-color:var(--blue);color:var(--blue)}
.scale input:checked+span{background:var(--blue);color:#fff;border-color:var(--blue)}
.scale input:focus-visible+span{outline:3px solid #6b6bff;outline-offset:2px}
.under{font-size:12px;margin-top:6px;display:flex;justify-content:space-between;color:#777}
textarea,select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:6px;background:#fff}
textarea{min-height:100px;resize:vertical}

/* 결과 화면 */
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:16px}td,th{padding:12px 8px;text-align:left;border-bottom:1px solid #e5e5e5}th{font-weight:600}

/* 과제 수행 화면 */
.progress{height:4px;background:#d6d6d6}.progress i{display:block;height:100%;background:var(--blue)}
.taskbar{position:relative;background:#eef0ff;border-bottom:2px solid var(--blue);padding:18px 220px;text-align:center}
.tb-task{max-width:900px;margin:0 auto}
.tb-screen{position:absolute;left:28px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700;color:#000}
.sq{display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:10px;background:#000;color:#fff;font-size:26px;font-weight:800;line-height:1}
.screen-pill{display:inline-flex;align-items:center;gap:12px;font-size:18px;font-weight:700;margin-bottom:22px}.screen-pill .sq{width:54px;height:54px;font-size:30px}
.taskbar p{word-break:keep-all;margin:8px 0 0;font-size:20px;font-weight:700;line-height:1.45;letter-spacing:-.035em;color:#000}
.taskbar .chip{background:var(--blue);border-color:var(--blue);color:#fff;font-size:13px;padding:3px 12px}
.tb-right{position:absolute;right:28px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:14px}.tb-right .btn{white-space:nowrap}.clock{color:#777;font-size:14px;min-width:60px;text-align:right}
.chip{display:inline-block;border:1px solid #000;border-radius:30px;padding:2px 10px;font-size:12px;font-weight:600}
.nav i{width:20px;margin-right:10px;text-align:center}
.link{border:0;background:none;padding:0;color:#2563eb;cursor:pointer;font:inherit;text-decoration:underline;text-underline-offset:2px}

/* 재현 화면(기존 ChatGPT) · 제안 대시보드 — 원본 유지 */
.workspace{display:grid;grid-template-columns:260px 1fr;min-height:max(640px,calc(100svh - 213px));background:#fff;color:#171717;font-family:Arial,'Noto Sans KR',sans-serif}
.sidebar{border-right:1px solid #e5e5e5;padding:24px 14px;background:#fafafa;color:#222}.sidebar strong{display:block;padding:5px 15px;margin-bottom:24px}
.nav{display:block;border:0;background:transparent;width:100%;text-align:left;padding:11px 16px;border-radius:8px;margin:3px 0}.nav:hover{background:#f0f0f0}.nav.active{background:#ececec}
.content{padding:35px 6%;color:#171717;max-width:1200px}.content h2{font-size:29px;font-weight:500;margin:0 0 32px}.content h3{font-size:17px}.content p{color:#586779}.muted{color:#6b7788}
.settingsbox{border:1px solid #dedede;border-radius:18px;padding:0 20px}
.row{padding:20px 0;display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid #e2e2e2}.row:last-child{border-bottom:0}.row p{margin:2px 0;font-size:13px;max-width:680px;color:#777}
.pill{background:#f1f1f1;border:0;border-radius:30px;padding:8px 16px;white-space:nowrap}
.toggle{width:42px;height:25px;border-radius:30px;padding:3px;border:0;background:#ddd;flex-shrink:0}.toggle i{display:block;width:19px;height:19px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0001;transition:transform .15s}.toggle.on{background:#3983fb}.toggle.on i{transform:translateX(17px)}
.wprimary{background:#254fc2;color:#fff;border-color:#254fc2}.wprimary:hover{background:#193b99}
.wchip{display:inline-block;border:1px solid #d5e1f6;color:#4768a4;background:#f0f5ff;border-radius:30px;padding:3px 10px;font-size:12px}
.weyebrow{color:#4868b1;letter-spacing:.12em;font-size:12px;font-weight:bold}
.proposed{background:#f5f7fc}.proposed .sidebar{background:#182a46;color:#c7d3e7}.proposed .nav{color:#c7d3e7}.proposed .nav:hover{background:#25395a}.proposed .nav.active{background:#304565;color:#fff}
.proposed .content{max-width:none;color:#19283f}.proposed .content h2{font-weight:700;font-size:28px;margin-bottom:8px}.proposed .settingsbox{background:#fff;border-color:#e1e6ef}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:28px 0}.metric{background:#fff;border:1px solid #dde5f0;border-radius:14px;padding:20px;text-align:left}.metric b{display:block;font-size:26px;margin:9px 0}.metric span{font-size:12px;color:#6380a8}
.modalback{position:fixed;inset:0;background:#0005;display:flex;align-items:center;justify-content:center;padding:24px;z-index:5}
.modal{background:#fff;border-radius:20px;width:820px;max-width:100%;max-height:85vh;overflow:auto;padding:28px;color:#222;box-shadow:0 20px 80px #0002;font-family:Arial,'Noto Sans KR',sans-serif}
.modalhead{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eee;padding-bottom:14px}.modalhead h3{margin:0;font-size:23px}.modal p{color:#333}
.modal .actions{display:flex;gap:10px;margin-top:20px}
[hidden]{display:none!important}
.choice{display:grid;gap:8px}.choice label{margin:0}.choice input{position:absolute;opacity:0}.choice span{display:block;border:1px solid var(--line);padding:12px 16px;border-radius:6px;cursor:pointer;font-weight:600}.choice span:hover{border-color:var(--blue);color:var(--blue)}.choice input:checked+span{background:var(--blue);color:#fff;border-color:var(--blue)}.choice input:focus-visible+span{outline:3px solid #6b6bff;outline-offset:2px}
/* 삭제 완료 레이어 팝업 */
.layer{position:fixed;inset:0;background:#0004;display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.layerbox{background:#fff;border-radius:16px;padding:30px 32px 26px;width:380px;max-width:100%;text-align:center;box-shadow:0 20px 60px #0003;font-family:Arial,'Noto Sans KR',sans-serif;color:#222}
.layerbox h3{margin:14px 0 6px;font-size:19px}.layerbox p{margin:0;color:#555;font-size:14px;line-height:1.5}.layerbox .btn{width:100%;margin-top:22px}
.layerbox.frame{font-family:inherit;color:#000;border-radius:12px;padding:32px 32px 26px}.layerbox.frame h3{font-size:21px;letter-spacing:-.04em}.layerbox.frame p{color:#444;font-size:15px;word-break:keep-all}
.layerbtns{display:flex;gap:10px;margin-top:24px}.layerbtns .btn{flex:1;min-width:0;width:auto;margin:0}

/* 제안 대시보드 (jh 프로토타입) */
.workspace.proposed{grid-template-columns:270px 1fr;background:#f6f7f9;color:#1a1f2b;font-family:Pretendard,'Noto Sans KR',Arial,sans-serif;--pb:#2f5fe0;--pbl:#eaf0ff;--pl:#e6e8ec}
.proposed i[aria-hidden]{font-style:normal}
.psb{background:#fbfbfc;border-right:1px solid var(--pl);padding:36px 20px 24px;display:flex;flex-direction:column}
.psb-brand b{display:block;font-size:20px;letter-spacing:-.03em}.psb-brand span{display:block;margin-top:4px;font-size:14px;letter-spacing:.08em;color:#667085}
.psb nav{margin-top:44px;display:grid;gap:6px}
.pnav{display:flex;align-items:center;gap:14px;width:100%;border:0;background:transparent;border-radius:10px;padding:16px 18px;font-size:17px;font-weight:600;color:#2a2f3a;text-align:left}
.pnav i{width:22px;text-align:center;font-size:18px;color:#5b6474}.pnav:hover{background:#f0f2f6}
.pnav.active{background:var(--pbl);color:var(--pb)}.pnav.active i{color:var(--pb)}
.psb-foot{margin-top:auto;padding-top:22px;border-top:1px solid var(--pl)}.psb-foot b{font-size:14px;color:#3a4150}.psb-foot p{margin:8px 0 0;font-size:13px;line-height:1.6;color:#667085!important}
.pmain{min-width:0;display:flex;flex-direction:column}
.ptop{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 48px;background:#fff;border-bottom:1px solid var(--pl)}
.crumb{font-size:14px;color:#667085}.crumb span{margin:0 12px}.crumb b{color:#1a1f2b}
.pchip-out{border:1px solid var(--pl);border-radius:8px;padding:6px 12px;font-size:13px;color:#555;background:#fff;white-space:nowrap}.pchip-out.sm{padding:3px 10px;font-size:12px}
.pbody{padding:44px 48px 28px}
.ph1{font-size:38px;font-weight:800;letter-spacing:-.04em;margin:0 0 10px}
.psub2{font-size:16px;color:#5b6474!important;margin:0}
.psubrow{display:flex;justify-content:space-between;align-items:flex-end;gap:16px}
.pmuted{color:#8a93a3!important;font-size:13px}
.pcards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:32px}
.pcard{background:#fff;border:1px solid var(--pl);border-radius:16px;padding:26px 26px 22px;text-align:left;color:inherit}
.pcard:hover{border-color:#c9d4f5;box-shadow:0 4px 16px #2f5fe010}
.pcard-h{display:flex;justify-content:space-between;align-items:center}.pcard-h b{font-size:16px}
.pico{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:9px;background:#f1f3f7;color:#5b6474}.pico.lg{width:54px;height:54px;font-size:20px;color:var(--pb);background:#f1f4fb}
.pnum{font-size:36px;font-weight:800;margin:18px 0 8px}.pnum small{font-size:14px;font-weight:500;margin-left:6px;color:#667085}
.pcard p{margin:0;font-size:14px;color:#5b6474!important}
.pnote{display:flex;align-items:center;gap:8px;margin:18px 0 0;font-size:13px;color:#667085!important}
.pbox{background:#fff;border:1px solid var(--pl);border-radius:16px;margin-top:26px;overflow:hidden}
.pbox-h{padding:26px 30px 18px}.pbox-h h2{margin:0;font-size:20px;letter-spacing:-.03em}.pbox-h p{margin:6px 0 0;font-size:14px;color:#5b6474!important}
.pstate{font-size:14px;color:#5b6474;white-space:nowrap}.pstate b{color:#1a1f2b;margin-left:4px}
.prow{display:flex;justify-content:space-between;align-items:center;gap:16px}.prow-r{display:flex;align-items:center;gap:16px}
.pgroup{display:flex;align-items:center;gap:16px}
.pbox-f{display:flex;align-items:center;gap:8px;padding:16px 30px;border-top:1px solid var(--pl);background:#fafbfc;font-size:13px;color:#667085}
.pbox-f.prow span{display:flex;align-items:center;gap:8px}
.ptable-wrap{padding:0 30px 8px;overflow:auto}
.ptable{width:100%;border-collapse:collapse;font-size:14px;margin:0}
.ptable th{background:#f6f7f9;color:#5b6474;font-weight:500;padding:14px 20px}.ptable td{padding:20px;border-bottom:1px solid var(--pl);vertical-align:middle;line-height:1.6}
.ptable tr:last-child td{border-bottom:0}
.pt{display:flex;align-items:center;gap:10px;font-weight:700;white-space:nowrap}.pt i{color:#5b6474}
.pbadge{display:inline-block;margin-top:4px;padding:2px 9px;border-radius:6px;font-size:12px;font-weight:700;background:#f1f3f7;color:#5b6474;white-space:nowrap}
.pbadge.blue{background:var(--pbl);color:var(--pb)}.pbadge.green{background:#e8f6ee;color:#16794a}.pbadge.red{background:#fdecec;color:#c53030}
.plink{border:0;background:none;padding:4px 0;color:var(--pb);font-weight:600;font-size:15px;white-space:nowrap}.plink i{font-size:11px;margin-left:6px}
.phlist{padding:0 30px 10px}
.phrow{display:flex;align-items:center;gap:16px;width:100%;border:0;border-top:1px solid var(--pl);background:none;padding:18px 0;text-align:left;color:inherit}
.phrow:first-child{border-top:0}.phrow>i{color:#98a1b2;font-size:12px}
.phico{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:10px;background:#f1f3f7;color:#5b6474;flex:0 0 40px}
.phtxt{flex:1}.phtxt b{display:block;font-size:15px}.phtxt small{font-size:12px;color:#8a93a3}
.ptabs{display:flex;gap:8px;margin-top:30px}
.ptab{border:1px solid var(--pl);background:#fff;border-radius:10px;padding:12px 20px;font-size:15px;font-weight:600;color:#3a4150}.ptab small{color:#8a93a3;margin-left:4px;font-size:14px}
.ptab.on{background:#1a2234;border-color:#1a2234;color:#fff}.ptab.on small{color:#c9d0dd}
.pfilter{display:flex;gap:12px;align-items:center;margin-top:22px}
.pfilter input[type=date]{height:50px;border:1px solid var(--pl);border-radius:10px;padding:0 14px;background:#fff;color:#333}
.psearch{flex:1;display:flex;align-items:center;gap:10px;height:50px;border:1px solid var(--pl);border-radius:10px;padding:0 16px;background:#fff;color:#8a93a3}
.psearch input{flex:1;border:0;outline:0;font-size:15px;background:none}
.pdel,.pdelbtn{display:inline-flex;align-items:center;gap:8px;height:50px;border:1px solid #f2c4c4;border-radius:10px;padding:0 18px;background:#fff;color:#d33;font-weight:600;white-space:nowrap}
.pdel:disabled,.pdelbtn:disabled{opacity:.5}
.pgrid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(280px,1fr);gap:24px;align-items:start;margin-top:22px}
.pgrid .pbox{margin-top:0}
.plist{max-height:560px;overflow:auto}
.plrow{display:grid;grid-template-columns:28px 1fr 110px;gap:16px;align-items:center;padding:18px 26px;border-top:1px solid var(--pl);cursor:pointer;font-size:15px}
.plrow:hover{background:#fafbfd}.plrow.sel{background:#eef3ff}
.plrow.phead{cursor:default;background:#f6f7f9;color:#5b6474;font-size:14px;padding-top:14px;padding-bottom:14px}
.plrow input{width:18px;height:18px;accent-color:var(--pb)}
.pltitle{font-weight:700}.pldate{font-size:13px;color:#8a93a3}
.plfoot{padding:14px 26px;border-top:1px solid var(--pl);font-size:12px;color:#8a93a3}
.pempty{padding:28px;text-align:center;color:#8a93a3;font-size:14px}
.pdetail{padding:28px 28px 30px}
.pdet-k{font-size:12px;font-weight:700;color:#667085}
.pdetail h3{margin:14px 0 6px;font-size:21px;letter-spacing:-.03em;word-break:keep-all}
.pbubble{margin:20px 0;background:#f6f7f9;border-radius:12px;padding:18px 20px;font-size:14px;line-height:1.8}.pbubble p{margin:0;color:#222!important}.pbubble p+p{margin-top:12px}
.pdetail dl{display:grid;grid-template-columns:100px 1fr;gap:12px 10px;margin:18px 0 24px;font-size:14px}.pdetail dt{color:#8a93a3}.pdetail dd{margin:0;color:#222}
.pdelbtn{height:48px}
.pfileprev{margin:20px 0 0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:28px;border:1px dashed #cfd6e2;border-radius:12px;color:#5b6474}.pfileprev i{font-size:30px;color:var(--pb)}.pfileprev small{color:#8a93a3}
.pdet-empty{text-align:center;padding:60px 10px;color:#8a93a3}.pdet-empty i{font-size:26px}.pdet-empty p{margin:12px 0 0;line-height:1.7;color:#8a93a3!important}
.pnotebox{border:1px solid var(--pl);border-radius:10px;padding:14px 16px;font-size:13px;line-height:1.6;color:#555}
.pset{padding:26px 30px;border-top:1px solid var(--pl)}
.pset-h{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}.pset-h b{font-size:17px}.pset-h p{margin:6px 0 0;font-size:14px;color:#5b6474!important}
.proposed .toggle{width:54px;height:30px}.proposed .toggle i{width:24px;height:24px}.proposed .toggle.on{background:var(--pb)}.proposed .toggle.on i{transform:translateX(24px)}
.ponoff{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}.ponoff div{background:#f6f7f9;border-radius:10px;padding:16px 18px}.ponoff b{font-size:14px}.ponoff p{margin:6px 0 0;font-size:14px;color:#5b6474!important}
.pset-n{margin:16px 0 0;font-size:13px;color:#5b6474!important}
.pseg{display:inline-flex;gap:4px;margin-top:28px;background:#eef0f4;border-radius:12px;padding:5px}
.pseg button{border:0;background:none;border-radius:9px;padding:10px 20px;font-size:15px;color:#5b6474}.pseg button.on{background:#fff;color:#1a1f2b;font-weight:700;box-shadow:0 1px 3px #0001}
.phtable{font-size:14px}
.phth,.phtr{display:grid;grid-template-columns:1fr 1.6fr .9fr;gap:12px;align-items:center;padding:16px 24px}
.phth{background:#f6f7f9;color:#5b6474}

const orders={A:['existing','proposal'],B:['proposal','existing']};

 {id:'memory',title:'기억된 내용 확인하기',lead:'생성형 AI 서비스는 대화하면서 알게 된 내 정보를 기억해 두고 답변에 활용합니다.<br>이 서비스가 <u>나에 대해 어떤 내용을 기억하고 있는지</u> 찾아서 확인해 주세요.',instruction:'이 서비스가 나에 대해 어떤 내용을 기억하고 있는지 찾아서 확인해 주세요.'},

function fileRows(){return FILES.map(([n,d],i)=>row(n,d,`<button class="pill" data-file="${i}">열기</button>`)).join('')}

/* 전송 대기함(outbox): 서버가 {ok:true}로 답한 기록만 지웁니다. 실패하면 브라우저에 남겨 두고 다시 보냅니다. */
let flushing=null;
function snapshot(){const {outbox,...rest}=session;return JSON.parse(JSON.stringify(rest))}
function newId(){return typeof crypto.randomUUID==='function'?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2)}
function send(kind,payload){if(!ENDPOINT||!session)return;(session.outbox=session.outbox||[]).push({eventId:newId(),kind,sessionId:session.id,code:session.code,studyType:session.studyType,order:session.order.join('>'),version:VERSION,sentAt:new Date().toISOString(),payload:JSON.parse(JSON.stringify(payload))});persist();flush()}
function flush(){if(!ENDPOINT||!session)return Promise.resolve(true);if(flushing)return flushing;const box=session.outbox=session.outbox||[];flushing=(async()=>{while(box.length){try{const r=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(box[0])});const j=await r.json();if(!j||!j.ok)break;box.shift();persist()}catch{break}}flushing=null;return box.length===0})();return flushing}

function intro(){window.scrollTo(0,0);stage='intro';const old=saved();
const storeNote=ENDPOINT?'응답은 연구용 데이터 시트로 전송됩니다.':'검토용: 응답은 이 브라우저에만 저장됩니다.';
app.innerHTML=`<main class="intro-wrap"><div class="intro-hero"><section class="intro-copy"><p class="intro-eyebrow">사용자 경험 비교 연구</p><h1>내 데이터 관리,<br>어떻게 설정하시나요?</h1><p class="intro-description">두 가지 데이터 설정 화면을 사용하고, 정보를 찾고 설정하는 경험을 알려주세요.</p>

const fakeMemory=`<h3>개요</h3><p>사용자는 IT 기업에서 서비스 기획 업무를 담당하는 직장인입니다. 업무 자료 정리, 발표 준비, 일상적인 정보 탐색과 여행 계획을 위해 생성형 AI를 활용합니다. 복잡한 내용을 쉽게 풀어 설명하고, 필요한 정보를 항목별로 정리한 답변을 선호합니다. 최근에는 업무와 개인 일정을 함께 관리하는 방법에 관심이 있으며, 주말에는 산책이나 요리를 하며 여유롭게 시간을 보내려고 합니다.</p><h3>일과 업무</h3><p>사용자는 여러 부서의 의견을 모아 서비스 개선 방향을 정리하고, 회의 자료와 기획 문서를 작성하는 일을 합니다. 새로운 기능을 기획할 때는 사용자의 불편과 요구를 먼저 정리하고, 비슷한 서비스의 사례를 비교하는 방식을 선호합니다. 자료를 검토할 때는 핵심 내용, 판단 근거, 추가로 확인할 사항이 구분되어 있으면 이해하기 쉽다고 느낍니다.
발표 자료는 한 화면에 내용을 많이 넣기보다 핵심 메시지를 중심으로 간결하게 구성하려고 합니다. 디자인은 흰색 배경에 파란색이나 짙은 회색을 사용하는 차분한 스타일을 좋아합니다. 생성형 AI에는 회의 메모 요약, 문장 다듬기, 비교표 작성 등을 요청하며, 제안받은 내용은 직접 검토한 뒤 업무에 반영합니다.</p><h3>학습과 관심사</h3><p>사용자는 업무에 필요한 새로운 도구와 서비스 사용법을 꾸준히 배우고 싶어 합니다. 긴 설명을 한꺼번에 읽기보다는 전체 흐름을 먼저 확인하고, 필요한 부분을 단계별로 익히는 편입니다. 처음 접하는 개념은 일상적인 사례를 함께 들어주면 이해하기 쉽다고 느낍니다.
최근에는 데이터 시각화와 사용자 경험에 관심이 있습니다. 같은 정보라도 화면에 어떻게 배치하고 표현하느냐에 따라 이해하기 쉬운 정도가 달라진다고 생각합니다. 학습한 내용은 간단한 메모로 남기고, 실제 업무에 적용할 수 있는 예시를 따로 정리합니다.</p><h3>취미와 여가</h3><p>사용자는 산책과 사진 촬영을 즐깁니다. 사람이 지나치게 붐비는 장소보다 공원이나 강변처럼 천천히 걸을 수 있는 곳을 선호합니다. 사진은 전문 장비보다 휴대전화로 일상의 풍경을 기록하는 용도로 주로 촬영합니다. 날씨가 좋으면 카페에 들르거나 서점을 구경하며 시간을 보내기도 합니다.

집에서는 간단한 요리를 하거나 영화를 봅니다. 요리는 재료와 조리 과정이 복잡하지 않고, 한두 번 먹을 분량으로 만들 수 있는 메뉴를 선호합니다. 영화를 고를 때는 장르뿐 아니라 줄거리와 상영 시간을 함께 확인합니다. 결말을 미리 알게 되는 설명은 원하지 않습니다.</p>`;

function results(){window.scrollTo(0,0);clearInterval(timer);stage='results';modal.innerHTML='';const interrupted=!!session.active;const done=session.status==='completed';
app.innerHTML=`<main class="page wide"><section class="panel"><div class="meta">SESSION RECORD</div><h2 class="ptitle">${done?'테스트를 모두 마쳤습니다.':'현재 기록을 확인하세요.'}</h2><div class="hint" id="savestate" style="margin:14px 0 6px"></div>${interrupted?'<p class="error">화면 새로고침 또는 종료로 중단된 과제가 있습니다. 해당 과제는 완료 시간으로 계산하지 않았습니다.</p>':''}<p class="q" style="margin-top:30px">참여자 ${esc(session.code)}${ADMIN?` · ${session.studyType?esc(session.studyType)+'유형':'이전 버전 기록'} · ${session.order.map((v,i)=>'화면 '+'AB'[i]+'='+(v==='existing'?'기존':'제안')).join(', ')}`:''}</p><div style="overflow:auto"><table><thead><tr><th>화면</th><th>과제</th><th>경과 시간</th><th>클릭</th><th>탭 이탈</th><th>결과</th></tr></thead><tbody>${session.records.map(r=>`<tr><td>화면 ${scr(r.index)}${ADMIN?(r.condition==='existing'?' (기존)':' (제안)'):''}</td><td>${TASK_LABEL[r.task]||esc(r.task)}</td><td>${(r.elapsedMs/1000).toFixed(2)}초</td><td>${r.clicks}</td><td>${(r.hiddenMs/1000).toFixed(2)}초</td><td>${r.outcome==='success'?'완료':'중단'}</td></tr>`).join('')}</tbody></table></div>${ADMIN?'<p class="psub" style="margin-top:14px;font-size:13px">A유형은 기존 → 제안, B유형은 제안 → 기존 순서입니다. 두 유형의 과제와 설문은 동일합니다.</p>':''}<div class="btns left"><button class="btn primary" id="retry" hidden>다시 시도</button><button class="btn" id="csv" hidden>과제 결과 CSV</button><button class="btn" id="json" hidden>전체 응답 JSON</button><button class="btn" id="home">처음으로</button></div><p id="storage-error" class="error" role="alert"></p></section></main>`;
document.querySelector('#csv').onclick=()=>download('csv');document.querySelector('#json').onclick=()=>download('json');document.querySelector('#retry').onclick=updateSave;document.querySelector('#home').onclick=intro;updateSave()}
/* 저장 상태 레이어 팝업: 저장 중에는 닫을 수 없고, 끝나면 결과를 알려 줍니다 */
function saveLayer(state){let l=document.querySelector('#savelayer');if(!l){l=document.createElement('div');l.id='savelayer';l.className='layer';document.body.appendChild(l)}
const box=(icon,color,title,body,btns)=>`<div class="layerbox frame" role="alertdialog" aria-modal="true" aria-live="assertive" aria-labelledby="stitle"><i class="fa-solid ${icon}" style="font-size:38px;color:${color}"></i><h3 id="stitle">${title}</h3><p>${body}</p>${btns}</div>`;
if(state==='saving')l.innerHTML=box('fa-spinner fa-spin','var(--blue)','응답을 저장하고 있습니다','잠시만 기다려 주세요.<br><b>저장이 끝날 때까지 창을 닫지 마세요.</b>','');
else if(state==='ok')l.innerHTML=box('fa-circle-check','#16a34a','응답이 저장되었습니다','참여해 주셔서 감사합니다.<br>이제 창을 닫으셔도 됩니다.','<button class="btn primary" data-k="close">확인</button>');
else l.innerHTML=box('fa-triangle-exclamation','#d97706','응답 저장이 완료되지 않았습니다','인터넷 연결을 확인한 뒤 다시 시도해 주세요.<br>계속 실패하면 화면 아래의 백업 파일을 내려받아 연구자에게 보내 주세요.','<div class="layerbtns"><button class="btn" data-k="close">닫기</button><button class="btn primary" data-k="retry">다시 시도</button></div>');
const c=l.querySelector('[data-k=close]');if(c){c.onclick=()=>l.remove();c.focus()}const r=l.querySelector('[data-k=retry]');if(r)r.onclick=updateSave}
/* 아직 저장되지 않은 응답이 있으면 창을 닫거나 새로고침할 때 경고합니다 */
window.addEventListener('beforeunload',e=>{if(ENDPOINT&&session&&session.outbox&&session.outbox.length){e.preventDefault();e.returnValue=''}});
async function updateSave(){const el=document.querySelector('#savestate');if(!el)return;const show=(backup,retry)=>{document.querySelector('#csv').hidden=document.querySelector('#json').hidden=!backup;document.querySelector('#retry').hidden=!retry};
if(!ENDPOINT){el.innerHTML='<b>브라우저에만 저장됨 · 서버 전송 없음</b><br>이 기록은 현재 기기·브라우저에만 있습니다. 결과 파일을 내려받아 보관해 주세요.';show(true,false);return}
el.innerHTML='<b>응답을 저장하고 있습니다…</b><br>잠시만 기다려 주세요.';show(ADMIN,false);saveLayer('saving');const [ok]=await Promise.all([flush(),new Promise(r=>setTimeout(r,800))]);if(stage!=='results'){document.querySelector('#savelayer')?.remove();return}saveLayer(ok?'ok':'fail');
if(ok){el.innerHTML='<b>응답이 저장되었습니다.</b><br>참여해 주셔서 감사합니다.';show(ADMIN,false)}else{el.innerHTML='<b>응답 저장이 아직 완료되지 않았습니다.</b><br>인터넷 연결을 확인한 뒤 ‘다시 시도’를 눌러 주세요. 계속 실패하면 아래 백업 파일을 내려받아 연구자에게 보내 주세요.';show(true,true)}}
function download(type){let text;if(type==='json')text=JSON.stringify(snapshot(),null,2);else{const cols=['session_id','participant_code','study_type','version','condition','task','started_at','elapsed_ms','clicks','hidden_ms','outcome','errors','ease','comment'];const cells=x=>'"'+String(x??'').replace(/"/g,'""').replace(/^[=+@-]/,"'$&")+'"';text='\uFEFF'+[cols,...session.records.map(r=>[session.id,session.code,session.studyType,session.version,r.condition,r.task,r.startedAt,r.elapsedMs,r.clicks,r.hiddenMs,r.outcome,r.errors,r.ease,r.comment])].map(row=>row.map(cells).join(',')).join('\r\n')}const url=URL.createObjectURL(new Blob([text],{type:type==='json'?'application/json;charset=utf-8':'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='ux-study-'+session.code.replace(/[^a-z0-9_-]/gi,'_')+'.'+type;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.addEventListener('visibilitychange',()=>{if(stage!=='task'||completed)return;if(document.hidden)hiddenAt=performance.now();else if(hiddenAt!==null){away+=performance.now()-hiddenAt;hiddenAt=null}});
{const o=saved();if(ENDPOINT&&o&&o.outbox&&o.outbox.length){session=o;flush()}}
intro();
</script></body></html>
